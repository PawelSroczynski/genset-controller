<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genset controller simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231A2332'/><text x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='700' fill='%23F7A800'>⚙</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script id="defaultYaml" type="text/yaml">
name: Genset controller FOGO FH9000R — SMARTBOB SM-MINI-0808R
description: >
  Models the GENSET ONLY. Reads the Deye G-start dry contact, cranks with an
  attempt limit, stops the engine by shorting the ignition to ground once the
  signal drops. No gasifier here — no blower, no gas valve, no bed state.
  A cycle opens on the Deye signal and closes on the return to ready.

  NAMING CONVENTION: states in this layer carry the AGR_ prefix (aggregate).
  Further layers get their own: GAZ_ for the gasifier, RET_ for the retort.
  Without it AGR_RUNNING and GAZ_RUNNING would collide once the machines
  stand side by side — a running engine and a reactor producing gas are not
  the same state.

genset:
  model: FOGO FH9000R
  datasheet: https://www.fogo.pl/fh-9000-r
  engine: Honda GX390
  note: >-
    8.5 kVA, 400/230 V three-phase, AVR on all three phases. The electric
    starter, the relay start input and the battery are retrofits — the vendor
    page does not list them, which is why the start signal has to be wired
    rather than requested over a bus.

controller:
  model: SMARTBOB SM-MINI-0808R
  datasheet: https://smartbob.pl/produkt/sm-mini-0808r/
  documentation: https://smartbobautomatyka.github.io/SmartbobPageWiki/
  templates: https://github.com/SmartbobAutomatyka/SmartbobAutomatyka-GIT/tree/main/ESPHOME/SM-MINI-0808R-V17
  pinout: https://docs.google.com/spreadsheets/d/1f-NrrFuqd2Pu4SJJxyYbYXiO_AjEefHKa8IfUKU8CmM/edit?gid=1302523101

parameters:
  # The Deye request must be continuously ON for this long before the logic
  # accepts it. It lives in the INPUT FILTER, not in a state: holding a signal
  # is signal conditioning, and a state timer cannot express it — a state timer
  # measures time in the state, which has already elapsed while the controller
  # sat idle. Same thing as `delayed_on` on the ESPHome binary_sensor.
  t_request_hold: 5      # s
  # Minimum dwell in AGR_READY after a closed cycle or a fault reset, so the
  # controller never cranks again the instant the engine has stopped.
  # This one is correctly measured as time in the state.
  t_ready: 5             # s
  t_crank: 3             # s — maximum duration of a single cranking attempt
  t_pause: 10            # s — starter rest between attempts
  attempts_max: 3
  t_rundown: 10          # s — time allowed for the engine to come to a stop

counters:
  attempts: 0

# =====================================================================
#  MEASUREMENTS — analogue quantities the simulator models and displays.
#
#  None of these is an input to the state machine. They exist because a state
#  name alone does not tell you whether the plant is healthy, and because two
#  of them explain limits that otherwise look arbitrary:
#  `u_gen` is the quantity the IN-02 voltage relay actually watches, and
#  `u_batt` is why cranking has an attempt budget at all.
#
#  `model` names the behaviour the simulator implements for each one.
# =====================================================================
measurements:
  u_gen:
    label: Genset phase voltage
    unit: V
    min: 0
    max: 440
    ok_from: 360
    ok_to: 420
    model: gen_voltage
    description: >-
      What the DIN-rail voltage monitoring relay on IN-02 measures. The relay
      closes its contact inside the working window, and that contact is the
      only proof the controller has that the engine is actually producing.
  t_engine:
    label: Engine temperature
    unit: °C
    min: 0
    max: 120
    warn_above: 95
    alarm_above: 110
    model: engine_temp
    description: >-
      Air-cooled GX390. Climbs under load, falls when stopped. Below 40 °C is
      where a choke would be needed — which this controller does not yet have.
  u_batt:
    label: Starter battery
    unit: V
    min: 8
    max: 15
    warn_below: 10.5
    alarm_below: 9.5
    model: starter_battery
    description: >-
      Sags hard while the starter turns and only partly recovers between
      attempts. THIS IS WHY THE ATTEMPT LIMIT EXISTS: three attempts is a
      budget, not a formality. Watch it fall across a failed start cycle.
  soc:
    label: Bank SOC
    unit: "%"
    min: 0
    max: 100
    warn_below: 25
    model: bank_soc
    description: >-
      Read from the Deye over Modbus, register 588. Falls on island load,
      rises while the genset charges. Informational only — the state machine
      acts on the G-start contact, not on SOC.
  p_pv:
    label: PV power
    unit: W
    min: 0
    max: 4500
    model: pv_power
    description: 8 x JA Solar JAM72D30-540/MB, 4.32 kWp on the barn.

# Energy chain shown in the synoptic bar, left to right.
# The chain now reads in causal order and closes a loop: the phase the genset
# produces goes back into the bank, which is what asks for it in the first place.
synoptic:
  - { id: pv,      label: PV }
  - { id: load,    label: load }
  - { id: bank,    label: bank }
  - { id: deye,    label: Deye }
  - { id: request, label: GS contact }
  - { id: engine,  label: engine }
  - { id: phase,   label: phase }

inputs:
  gen_request:
    pin: IN-01
    label: Deye start signal
    description: >-
      G-start dry contact, inverter terminals 1 and 2.
      ON = genset run requested. OFF = no request.
      The logic sees this input only after it has been held for
      {t_request_hold} s; dropping it is immediate. Asymmetric on purpose —
      a transient request must not start the engine, but a withdrawn request
      must stop the cranking at once.
    hold: t_request_hold
  running:
    pin: IN-02
    label: Run confirmed
    description: >-
      External DIN-rail voltage monitoring relay wired to the genset output
      phase. Its dry contact feeds IN-02.
      ON = voltage within the working window, i.e. the genset is producing.
    device:
      name: e.g. Relpol RPN-.VF-A400
      url: https://www.relpol.pl/Produkty/Przekazniki-nadzorcze/Przekazniki-nadzorcze-modulowe/Przekazniki-nadzorcze-RPN-.VF-A400
  co_alarm:
    pin: IN-03
    label: CO alarm
    description: >-
      Alarm contact of the carbon monoxide detector in the plant room, on IN-03.
      ON = carbon monoxide detected. The detector needs a second contact for
      the hardwired permit chain, which stops the engine independently of
      the controller.
  reset:
    pin: IN-04
    label: Fault reset
    description: >-
      Momentary pushbutton in the cabinet door, on IN-04.
      ON = pressed. Returns to OFF on release.
    momentary: true

outputs:
  ignition:
    pin: RELAY-01
    label: Ignition relay
    # `short` is what the indicator board shows. The board has to hold ten or
    # more relays once the gasifier and the retort arrive, so the row is one
    # line and the full label lives in the tooltip.
    short: IGNITION
    description: >-
      ON = the NC contact in the kill line is open, ignition circuit live.
      OFF = ignition shorted to ground, engine stopped.
  starter:
    pin: RELAY-02
    label: Starter relay
    short: STARTER
    description: >-
      Drives the starter contactor coil; it does not feed the starter directly.
      ON = contactor closed, starter cranking. OFF = contactor open.

states:
  AGR_READY:
    x: 70
    y: 40
    description: >-
      Controller powered, outputs in the safe state. Kill line shorted to
      ground. Two independent conditions gate the start, on two different
      clocks: the request must have been held {t_request_hold} s (input filter)
      AND the controller must have been in this state {t_ready} s (state timer).
      The second one matters only right after a cycle or a fault reset; once
      the controller has stood idle it is long satisfied, and that is correct —
      a rested engine needs no dwell. The `not running` term blocks the start
      if the engine is somehow still turning.
    outputs: { ignition: false, starter: false }
    actions: { attempts: 0 }
    transitions:
      - to: AGR_CRANKING
        when: gen_request and not co_alarm and not running
        after: t_ready
        description: Request held {t_request_hold} s and ready dwell {t_ready} s elapsed — crank

  AGR_CRANKING:
    x: 300
    y: 40
    description: Starter engaged. The time limit protects the bendix.
    outputs: { ignition: true, starter: true }
    transitions:
      - to: AGR_FAULT
        when: co_alarm
        description: CO alarm during cranking
      - to: AGR_STOPPING
        when: not gen_request
        description: Deye signal lost while cranking
      - to: AGR_RUNNING
        when: running
        description: Run confirmed
      - to: AGR_FAULT
        after: t_crank
        when: attempts >= attempts_max - 1
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max}: no run confirmation within {t_crank} s — attempt limit exhausted"
      - to: AGR_PAUSE
        after: t_crank
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max}: no run confirmation within {t_crank} s — {t_pause} s pause"

  AGR_RUNNING:
    x: 530
    y: 40
    description: Engine running, inverter charging the bank.
    outputs: { ignition: true, starter: false }
    transitions:
      - to: AGR_FAULT
        when: co_alarm
        description: CO alarm with the engine running
      - to: AGR_FAULT
        when: not running
        description: Run confirmation lost without a stop command — cause outside the controller
      - to: AGR_STOPPING
        when: not gen_request
        description: Deye signal lost

  AGR_FAULT:
    x: 70
    y: 170
    fault: true
    description: >-
      Ignition relay OFF. Requires a manual reset. Resetting is blocked while
      run confirmation persists — that would mean a defective kill circuit.
    outputs: { ignition: false, starter: false }
    transitions:
      - to: AGR_READY
        when: reset and not co_alarm and not running
        description: Fault reset

  AGR_PAUSE:
    x: 300
    y: 170
    description: Starter thermal rest before the next attempt.
    outputs: { ignition: true, starter: false }
    transitions:
      - to: AGR_FAULT
        when: co_alarm
        description: CO alarm between attempts
      - to: AGR_RUNNING
        when: running
        description: Run confirmed with the starter OFF
      - to: AGR_READY
        when: not gen_request
        description: Deye signal lost between attempts — cycle aborted
      - to: AGR_CRANKING
        after: t_pause
        description: "{t_pause} s pause elapsed — next attempt"

  AGR_STOPPING:
    x: 530
    y: 170
    description: Ignition relay OFF — the NC contact shorts the ignition to ground.
    outputs: { ignition: false, starter: false }
    transitions:
      - to: AGR_READY
        when: not running
        description: Run confirmation lost
      - to: AGR_FAULT
        after: t_rundown
        description: "Run confirmation held {t_rundown} s after the ignition was shorted — kill circuit defective"
</script>
<script id="plantYaml" type="text/yaml">
name: Installation — the world the controller sits in
description: >
  Separate from state-machine.yaml on purpose. That file is the CONTROLLER:
  what gets flashed, what acts on contacts. This file is the PLANT around it:
  the bank, the PV, the loads, and the inverter that decides when to ask for
  the genset. The controller must know nothing of what is in here — it reads a
  dry contact and that is all.

  WHY THIS FILE EXISTS. Until now `gen_request` was a free input you toggled by
  hand. It is not an input at all: it is an OUTPUT of the Deye, computed from
  battery SOC with hysteresis. Toggling it modelled the wrong layer. The real
  chain is a feedback loop:

      cells -> BMS (SOC estimate) -> Deye (Start threshold) -> GS contact
            -> IN-01 -> AGR_ -> genset -> GEN port -> charges the bank -> cells

# =====================================================================
#  HARDWARE — figures from the installation, not invented
# =====================================================================
bank:
  capacity_kwh: 16.1
  nominal_v: 51.2
  note: ONVOLT, 16 x 314 Ah Welion Semi Solid, JK BMS 200 A
  caveat: >-
    SOC is modelled over the full capacity. The real bank is a LiFePO4 pack
    whose usable window is narrower, and whose SOC comes from a BMS ESTIMATOR
    that needs several full cycles to calibrate. Treat displayed SOC as the
    number the Deye sees, not as the energy actually left.

pv:
  kwp: 4.32
  note: 8 x JA Solar JAM72D30-540/MB, bifacial, on the barn

genset:
  kw_gas: 3.5
  kw_petrol: 5.6
  note: >-
    FOGO FH9000R. 5.6 kW on petrol, about 3.5 kW on water gas after the
    30-40 % derate. The gas figure is the one that matters in service.

loads:
  base_kw: 0.5
  shower_kw: 9.0
  shower_minutes: 8
  note: >-
    0.5 kW is 12 kWh/day averaged out. The shower is the PPE3 at its 9 kW
    setting — the binding constraint of the whole installation, and the reason
    the microswitches must be moved off 15 kW before the first island run.

# =====================================================================
#  DEYE — the device that decides. These are INVERTER SETTINGS, not ours.
# =====================================================================
deye:
  gen_start_soc: 30        # manual default. "Start = 30%": at this SOC the
                           # normally-open Gen Signal relay closes.
  gen_stop_soc: 80         # TO BE READ OFF THE DEVICE — the manual states the
                           # start threshold plainly but not the stop one.
  gen_charge_a: 40         # manual default. At 51.2 V that is about 2.05 kW,
                           # which is LESS than the 3.5 kW the genset makes.
                           # Left at the default deliberately: the question of
                           # what it should be is open and has to be settled on
                           # the inverter, against what the cells accept through
                           # the BMS and what the three-phase genset can give.
                           # The simulator shows the cost: genset load factor.
  island_mode: true
  contact: GS
  contact_note: >-
    Which terminal carries the start signal depends on the "Signal ISLAND MODE"
    setting. Ticked, it is GS; unticked, GV. Island mode is on here, so GS —
    which matches the G-start (1,2) pair in our wiring. Confirm on the device.

# =====================================================================
#  TIME — two clocks, and why
#
#  A full cycle is about 19 hours: roughly 16 h draining the bank and 3 h
#  charging it. The state machine runs in real seconds (t_crank is 3 s).
#  One clock cannot serve both.
#
#  So the plant clock runs fast while nothing is happening and drops to real
#  time the moment the controller has something to show. The multiplier is
#  always displayed — a hidden variable clock is worse than a slow one.
# =====================================================================
clock:
  warp: 240                # 1 s of simulation = 4 min of plant, while idle
  realtime_states: [AGR_CRANKING, AGR_PAUSE, AGR_STOPPING, AGR_FAULT]
  realtime_on_request: true   # also drop to 1x as soon as the request appears,
                              # so the request hold and the ready dwell are
                              # watchable. IN AGR_READY ONLY: the request stays
                              # asserted for the whole charging run, and without
                              # that restriction the clock sat at 1x for hours
                              # of charging and gave back half the benefit.

# =====================================================================
#  MEASUREMENTS of the plant, merged with those of the controller.
# =====================================================================
measurements:
  p_load:
    label: Island load
    unit: W
    min: 0
    max: 10000
    model: plant
    description: Base load plus the PPE3 shower when it runs. 9 kW on three phases.
  p_bank:
    label: Bank power
    unit: W
    min: -6000
    max: 6000
    model: plant
    description: Positive charges the bank, negative discharges it. This is what moves SOC.
  gen_load:
    label: Genset load factor
    unit: "%"
    min: 0
    max: 100
    warn_below: 70
    model: plant
    description: >-
      How much of the genset's output is actually used. The Deye caps charging
      at gen_charge_a, so with only the base load running the genset can be left
      at well under full load — which is precisely what a gasifier does not want.
      This gauge is here to answer that open question with a number.

# =====================================================================
#  DEYE_ — the inverter as a state machine. The contact is closed in
#  DEYE_REQUEST and DEYE_CHARGING, open in the other two.
#
#  THE HYSTERESIS IS THE POINT. Start 30 %, stop 80 %. Without the gap the
#  genset would chatter around the threshold — the same class of defect as the
#  two clocks in the start logic, and just as invisible until it is drawn.
# =====================================================================
states_deye:
  DEYE_PV:
    description: >-
      PV covers the loads and the surplus charges the bank. The genset contact
      is open. This is where the installation should spend the summer.
    contact: false
  DEYE_BANK:
    description: >-
      No surplus. The bank carries the load and SOC falls. Still no request —
      this is normal night-time operation, not a fault.
    contact: false
  DEYE_REQUEST:
    description: >-
      SOC reached the Start threshold, the normally-open Gen Signal relay has
      closed, and the Deye is waiting for voltage on the GEN port. The bank
      keeps draining in the meantime: asking is not the same as being helped.
    contact: true
  DEYE_CHARGING:
    description: >-
      The genset is producing and the Deye is charging the bank through the GEN
      port, current-limited by gen_charge_a. The contact stays closed until the
      stop threshold, because releasing it at the start threshold would stop the
      genset the instant it began to help.
    contact: true
</script>
<script id="skeletonYaml" type="text/yaml">
# =====================================================================
#  STATE SKELETON — PYROLYSIS RETORT + CHARCOAL GASIFIER (WATER GAS)
#
#  mode: SKELETON. The outputs have NO pins assigned, nothing here drives
#  hardware, and none of it may be flashed to a controller. The file records
#  the split into layers, the sequences and the interlocks — for review and
#  correction on paper, before the machines have signals.
#
#  TWO MACHINES, NOT ONE TABLE. The genset (AGR_, in state-machine.yaml) is
#  untouched. Two parallel layers are added here, and the joint between them
#  is a SINGLE SIGNAL each way, not shared transitions. Folding everything
#  into one table would multiply out to 6 x 10 x 9 combinations and the table
#  would be unreadable at the first bug.
# =====================================================================

mode: skeleton
name: Hybrid — pyrolysis retort and water-gas gasifier

#  ONE REACTOR, TWO OPERATING PHASES. RET_ and GAZ_ are not two machines. They
#  are two phases of the SAME vessel: it first carbonises wood into a charcoal
#  bed, then gasifies that bed with steam. Nothing is discharged in between and
#  nothing is seasoned — the fuel for the gas phase is the bed left behind by
#  the pyrolysis phase, in place.
#
#  THE FIRST CONSEQUENCE IS AN INTERLOCK: the vessel cannot be carbonising and
#  gasifying at the same time. The two phase groups are MUTUALLY EXCLUSIVE and
#  that is now the most important thing this model has to express.

layers:
  AGR_: genset FOGO FH9000R — separate machine, finished, in state-machine.yaml
  RET_: reactor, carbonisation phase — wood to a charcoal bed, batch
  GAZ_: reactor, gasification phase — water gas from that same bed

# =====================================================================
#  THE JOINT BETWEEN LAYERS — this is the whole integration
# =====================================================================
#
#  GAZ_ -> AGR_   one signal: `gas_ready`
#                 The AGR_READY exit condition widens from `gen_request`
#                 to `gen_request and gas_ready`.
#                 THAT IS THE ONLY CHANGE TO THE GENSET MACHINE. Nothing else.
#
#  AGR_ -> GAZ_   one signal: `engine_drawing`  (AGR_ is in AGR_RUNNING)
#                 The gasifier needs it: without the engine drawing, gas does
#                 not flow, the reactor idles and the bed cools down.
#
#  RET_ -> GAZ_   NO REAL-TIME SIGNAL AT ALL.
#                 The retort and the gasifier are coupled by INVENTORY, not by
#                 a signal: the retort makes charcoal, the charcoal seasons in
#                 the open for 8 days, then goes to the store, and the gasifier
#                 draws from the store. The timescale is days, not seconds.
#                 Wiring them with a state transition would be invented.
#                 The only thing that crosses: store level as a COUNTER in kg,
#                 never as a machine state.
#
#  SHARED, ABOVE THE LAYERS — these feed all three
#                 `co_alarm`     carbon monoxide alarm in the plant room
#                 `t_pile`       temperature inside the charcoal pile
#                 `t_buffer_top` top-zone temperature of the 4 m3 buffer
#                 None of these belongs to any layer. They are the background
#                 all three machines operate in.

# =====================================================================
#  PARAMETERS — TBD means the number does not exist yet, and where it must
#  come from
# =====================================================================
parameters:
  # --- gasifier ---
  t_bed_min:          TBD   # degC — water-gas reaction threshold; below it the
                            # steam only cools the bed and the product is CO2
                            # with unreacted water. The literature on charcoal
                            # beds quotes 700-900 degC.
                            # SOURCE: a thermocouple in the CXF, not a paper.
  t_warmup_max:       TBD   # s — warm-up limit; past it, fault rather than wait
  t_flare_min:        TBD   # s — how long the gas must burn steadily before it
                            # may be considered fit for the engine
  t_purge:            TBD   # s — purge of the reactor-to-mixer run before the
                            # engine valve opens; clears air out of that section
  kg_per_kwh:         0.82  # kg charcoal/kWh — from the CXF sheet, range 0.78-0.85
  l_water_per_kg:     1.0   # l water/kg charcoal — vendor figure; it lands
                            # exactly on the autothermal limit (956 g)
  hopper_kg:          5     # kg — CXF hopper, about 1.8 h of running

  # --- retort ---
  t_devol_min:        TBD   # degC — threshold above which the pyrolysis gas
                            # burns by itself and external firing can stop
  t_bed_safe:         TBD   # degC — below this the carbonisation cycle may be
                            # declared over: the phase may hand over, or the bed
                            # may be opened and taken out. It must follow from
                            # safety, not from impatience: hot char ignites the
                            # moment it meets air.
  t_cooldown_min:     TBD   # s — minimum time sealed, REGARDLESS of what the
                            # thermocouple reads. The probe measures one point;
                            # a 200 kg charge has a gradient.

  # --- buffer, shared ---
  t_buffer_set:       70    # degC — working setpoint
  t_buffer_cutoff:    78    # degC — cutoff. Above 82 degC the EPDM membrane
                            # softens. The 4 K margin is not caution, it is
                            # 4000 l of near-boiling water in a room full of
                            # electronics.

# =====================================================================
#  COUPLING — the joint between the three machines, AS DATA.
#  The interworking diagram in the simulator is rendered from this section,
#  so a wrong coupling is visible rather than buried in a comment.
# =====================================================================
coupling:
  # Lane order for the interworking diagram. Explicit rather than derived from
  # key order, because key order in state-machine.yaml follows the diagram
  # layout, not the process flow. Validated against the state tables: every
  # entry must exist and every state must appear exactly once.
  lanes:
    - layer: RET_
      label: Reactor, carbonisation phase — wood to a charcoal bed
      source: states_retort
      order: [RET_COLD, RET_CHARGING, RET_LIGHTING, RET_DEVOLATILISING, RET_FINISHING,
              RET_COOLDOWN, RET_FAULT]
    - layer: GAZ_
      label: Reactor, gasification phase — water gas from that bed
      source: states_gas
      order: [GAZ_COLD, GAZ_LIGHTING, GAZ_WARMUP, GAZ_FLARE, GAZ_READY,
              GAZ_PURGE, GAZ_SUPPLYING, GAZ_SHUTDOWN, GAZ_COOLDOWN, GAZ_FAULT]
    - layer: AGR_
      label: Genset FH9000R — live machine, simulated in the AGR_ view
      source: state_machine
      order: [AGR_READY, AGR_CRANKING, AGR_PAUSE, AGR_RUNNING, AGR_STOPPING, AGR_FAULT]
  links:
    - from: GAZ_READY
      to: AGR_READY
      signal: gas_ready
      kind: signal
      description: >-
        Widens the AGR_READY exit condition from `gen_request` to
        `gen_request and gas_ready`. THE ONLY CHANGE TO THE GENSET MACHINE.
    - from: AGR_RUNNING
      to: GAZ_PURGE
      signal: engine_drawing
      kind: signal
      description: >-
        Without the engine drawing, gas does not flow: the reactor idles and the
        bed cools down. It also gates the purge, after which the engine valve
        may open.
    - from: RET_COOLDOWN
      to: GAZ_COLD
      signal: bed = char
      kind: phase
      description: >-
        PHASE HANDOVER INSIDE ONE VESSEL, not a transfer between two machines.
        The carbonisation cycle ends at RET_COOLDOWN and what it leaves behind
        is the charcoal bed the gasification phase burns. Nothing is discharged
        and nothing is seasoned in between.
        The vessel cannot run both phases at once, so entering any GAZ_ phase
        requires the RET_ group to be at rest, and the reverse holds too.
  exclusion: >-
    RET_ and GAZ_ are phase groups of ONE vessel and are mutually exclusive.
    At any moment the reactor sits in exactly one phase of one group. Lighting
    a carbonisation batch while the bed is being gasified, or the reverse, is
    not a race to be resolved in software — it has to be impossible.
  shared:
    signals: [co_alarm, t_pile, t_buffer_top]
    description: >-
      These belong to no layer. They are the background all three machines
      operate in: a CO alarm faults every one of them, pile temperature warns of
      char self-ignition with nobody's involvement, and buffer temperature caps
      heat recovery before the EPDM membrane has to work at 80 degC.

counters:
  batch_no:     0   # carbonisation batch number
  gas_attempts: 0
  # `bed` is not a count but the state of the vessel's contents, and it is what
  # decides which phase group may run next:
  #   empty  -> only RET_ (charge wood)
  #   wood   -> only RET_ (carbonise it)
  #   char   -> only GAZ_ (gasify it), or a manual discharge for sequestration
  bed: empty

# =====================================================================
#  INPUTS — THESE SIGNALS DO NOT EXIST YET. This is a list to collect.
# =====================================================================
inputs:
  # --- gasifier ---
  t_bed:
    type: analogue
    label: Bed temperature
    description: >-
      Type-K thermocouple in the reduction zone. The single most important
      measurement in the GAZ_ layer — it decides when steam may be injected
      and when the gas is fit for the engine.
    missing: Whether the CXF already has a thermocouple port, or it must be drilled.
  hopper_low:
    type: binary
    label: Charcoal hopper low
    description: Level switch in the 5 kg hopper. ON = refill.
    missing: Whether the CXF has such a switch.
  water_ok:
    type: binary
    label: Cracking water present
    description: >-
      Level in the water tank. Running out of water with a hot bed is not
      a standstill — it is a bed burning in clean air, without the endothermic
      reaction that was cooling it.
  flare_flame:
    type: binary
    label: Flame at the flare
    description: >-
      Flame detector (ionisation or UV) at the flare outlet. The only direct
      evidence that the gas is combustible rather than nitrogen and CO2.
  engine_valve_fb:
    type: output_feedback
    label: Engine gas valve position feedback
    description: Limit switch on the valve. Position must be read, not assumed.

  # --- retort ---
  t_retort:
    type: analogue
    label: Charge temperature
    description: Thermocouple in the core of the charge. One point — see t_cooldown_min.
  hatches_closed:
    type: binary
    label: Retort hatches closed
    description: >-
      Limit switches on the charging and discharge hatches, in series.
      Pyrolysis with a hatch open is combustion of the charge, not carbonisation.
  afterburner_flame:
    type: binary
    label: Flame in the pyrolysis gas afterburner
    description: >-
      Pyrolysis gas is tar-laden and MUST NOT be fed to the engine. It goes to
      the afterburner and its heat to the buffer. Flame loss while devolatilising
      means tar and CO are venting into the room instead of up the stack.

  # --- shared ---
  co_alarm:
    type: binary
    label: CO alarm
    description: >-
      The same detector that already feeds IN-02 of the genset.
      !! A DELIBERATE GAP: a CO detector does not see hydrogen. Water gas is
      close to 28 % H2, and hydrogen rises to the ceiling. Ventilation from the
      highest point of the room is the safeguard here, not the detector.
  t_pile:
    type: analogue
    label: Temperature inside the charcoal pile
    description: >-
      The only early warning of char self-ignition, and it now watches something
      OUTSIDE this cycle. Char that stays in the vessel and is gasified never
      forms a pile; this applies to char taken out by hand for sequestration,
      which no state here covers. A pile heats itself with nobody's involvement,
      a rising trend means rake it out, and it is not extinguished with water.
  t_buffer_top:
    type: analogue
    label: Buffer top-zone temperature
    description: Cuts heat recovery before the EPDM membrane has to work at 80 degC.

# =====================================================================
#  OUTPUTS — NO PINS. A list of intent, not a configuration.
# =====================================================================
outputs:
  blower:
    pin: TBD
    label: Primary air blower
    description: Air to the oxidation zone. That is what powers the endothermic reaction.
  steam_injection:
    pin: TBD
    label: Steam injection
    description: >-
      HARD INTERLOCK: only while t_bed > t_bed_min and water_ok.
      Steam onto a cold bed is lost heat and gas with no calorific value.
  flare_valve:
    pin: TBD
    label: Valve to the flare
    description: The gas path to open air. Default state OPEN — the gas must have a way out.
  engine_gas_valve:
    pin: TBD
    label: Gas valve to the engine
    description: >-
      Opening is permitted only from GAZ_READY, after the purge.
      Default state CLOSED. Loss of power must close it by itself —
      a spring-return valve, not a bistable one.
  buffer_pump:
    pin: TBD
    label: Heat recovery circulation pump to the buffer
  dump_radiator:
    pin: TBD
    label: Three-way valve to the dump radiator
    description: >-
      Above t_buffer_cutoff the heat goes to air. A lit retort batch CANNOT BE
      STOPPED — 200 kg of charge releases about 1000 kWh and the buffer holds
      209 kWh. The dump radiator is not a safeguard against a fault, it is part
      of normal operation.
  ignition_burner:
    pin: TBD
    label: Retort ignition burner
    description: External heat source until devolatilisation is self-sustaining.
  afterburner_valve:
    pin: TBD
    label: Pyrolysis gas valve to the afterburner

# =====================================================================
#  LAYER GAZ_ — GASIFIER
# =====================================================================
states_gas:
  GAZ_COLD:
    x: 70
    y: 40
    description: >-
      Reactor cold, bed may or may not be loaded. Engine valve closed, flare
      open. The resting state — and the one everything returns to.
    outputs: { blower: false, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_LIGHTING
        when: gas_demand and bed == char and not co_alarm
        description: >-
          Run requested and the vessel holds a charcoal bed left by a completed
          carbonisation cycle. There is no store to draw from — the fuel is
          already inside.

  GAZ_LIGHTING:
    x: 300
    y: 40
    description: >-
      Lighting the bed. OPEN QUESTION: does the CXF have electric bed ignition,
      or is it lit by hand only. If by hand, this is NOT a controller state —
      it is a human state, and the controller merely waits on t_bed with
      nothing here to energise.
    outputs: { blower: true, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_WARMUP
        when: t_bed > 300
        description: Bed has caught — it climbs on its own from here

  GAZ_WARMUP:
    x: 530
    y: 40
    description: >-
      The bed climbs to reaction temperature. NO STEAM YET — this phase is
      purely exothermic, air onto charcoal. The gas is weak, goes to the flare
      and is not treated as combustible.
    outputs: { blower: true, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_FAULT
        after: t_warmup_max
        description: Bed failed to reach temperature within the limit — wet charcoal or a draught
      - to: GAZ_FLARE
        when: t_bed > t_bed_min and water_ok
        description: Reaction temperature reached and water present — steam may be injected

  GAZ_FLARE:
    x: 760
    y: 40
    description: >-
      Full water-gas reaction, steam injected, but the gas STILL GOES TO THE
      FLARE. This is the evidential state: the flame at the flare is the only
      direct proof that the pipe carries combustible gas rather than nitrogen
      and CO2. Only after t_flare_min of steady flame may the gas be considered
      fit for the engine. It is also the only place where air leaves the line.
    outputs: { blower: true, steam_injection: true, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_WARMUP
        when: t_bed < t_bed_min
        description: Bed quenched by the injection — steam OFF, reheat
      - to: GAZ_FAULT
        when: not water_ok
        description: No water with a hot bed — the charcoal burns without the cracking reaction
      - to: GAZ_READY
        when: flare_flame
        after: t_flare_min
        description: Flame steady for {t_flare_min} s — gas accepted

  GAZ_READY:
    x: 990
    y: 40
    description: >-
      THIS IS THE JOINT. The only state that raises the `gas_ready` signal read
      by the AGR_ layer. The reactor makes gas to the flare and waits. The
      genset may start, or may not. The engine valve is still closed — it opens
      only after the purge, once the genset reports that it is drawing.
    outputs: { blower: true, steam_injection: true, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: true }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_FLARE
        when: not flare_flame or t_bed < t_bed_min
        description: Gas quality lost — the ready signal is withdrawn
      - to: GAZ_PURGE
        when: engine_drawing
        description: Genset confirmed running — purge the run to the mixer
      - to: GAZ_SHUTDOWN
        when: not gas_demand
        description: Demand withdrawn without the engine ever starting

  GAZ_PURGE:
    x: 760
    y: 170
    description: >-
      The reactor-to-mixer run is full of air. Before the engine valve opens,
      that run must be filled with gas. A separate state, because it is a
      separate hazard: hydrogen mixed with air in a closed pipe has a wide
      explosive range.
    outputs: { blower: true, steam_injection: true, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: true }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_SUPPLYING
        after: t_purge
        when: engine_drawing
        description: Line purged — engine valve opens
      - to: GAZ_READY
        when: not engine_drawing
        description: Engine stopped drawing mid-purge

  GAZ_SUPPLYING:
    x: 990
    y: 170
    description: >-
      Gas flows to the engine. The flare stays OPEN — the gas must keep a way
      out even if the engine suddenly stops drawing. Closing both paths on a
      hot reactor is pressure rise in a closed vessel.
    outputs: { blower: true, steam_injection: true, flare_valve: true, engine_gas_valve: true }
    signals: { gas_ready: true }
    transitions:
      - to: GAZ_FAULT
        when: co_alarm
      - to: GAZ_READY
        when: not engine_drawing
        description: Engine stopped — engine valve closes, gas returns to the flare
      - to: GAZ_SHUTDOWN
        when: not gas_demand
        description: End of cycle

  GAZ_SHUTDOWN:
    x: 300
    y: 170
    description: >-
      UNRESOLVED STATE — TWO PROCEDURES WITH OPPOSITE RISKS. This has to be
      settled with ThriveOffgrid, because it decides what is left in the room
      overnight.
        (a) DRAW DOWN with the engine: run until the bed is spent. The reactor
            ends up cold and empty, but the engine gets the worst-quality gas
            at the end and air passes through the reactor.
        (b) SEAL IT: cut the air and let it die. A hot bed remains, with CO in
            the reactor. Gas-tightness becomes the safeguard.
      Not choosing on the vendor's behalf. The skeleton leaves the branch open.
    outputs: { blower: TBD, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_COOLDOWN
        when: TBD
        description: Depends on the chosen procedure

  GAZ_COOLDOWN:
    x: 70
    y: 170
    description: >-
      Reactor hot, not producing. The room needs ventilation — CO is still
      being formed in this state and there is no longer a flame burning it off.
    outputs: { blower: false, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_COLD
        when: t_bed < 60

  GAZ_FAULT:
    x: 530
    y: 170
    fault: true
    description: >-
      Steam OFF, blower OFF, engine valve CLOSED, flare OPEN. The flare stays
      open deliberately: in a fault the gas must have a way out to open air,
      not into the room and not into the engine.
      Reset only after cooldown — a hot reactor is still a gas source.
    outputs: { blower: false, steam_injection: false, flare_valve: true, engine_gas_valve: false }
    signals: { gas_ready: false }
    transitions:
      - to: GAZ_COLD
        when: reset and not co_alarm and t_bed < 60

# =====================================================================
#  LAYER RET_ — PYROLYSIS RETORT
#
#  A CONSTITUTIONAL DIFFERENCE FROM THE OTHER LAYERS:
#  once lit, a retort CANNOT BE STOPPED. The genset is killed by shorting the
#  ignition, the gasifier by cutting its air — but 200 kg of charge that has
#  started devolatilising will run to the end whatever the controller does.
#  So this layer has no "stopping" state. It has RET_DEVOLATILISING, whose only
#  exit is the end of the process, and a FAULT state that can do no more than
#  divert the heat to the dump radiator and call a human.
#  DESIGN CONSEQUENCE: the decision is made at lighting, not during the run.
#  The entry conditions must therefore be harder than anywhere else.
# =====================================================================
states_retort:
  RET_COLD:
    x: 70
    y: 40
    description: >-
      THE VESSEL AT REST — the state both phase groups return to and the only
      place the phase may change. What happens next is decided by `bed`:
      empty means charge wood, char means the gasification phase may light it,
      or the char may be taken out by hand for sequestration, which is outside
      this controller. Hatches may be opened here.
    outputs: { ignition_burner: false, afterburner_valve: false, buffer_pump: false }
    transitions:
      - to: RET_CHARGING
        when: charge_demand and bed == empty
        description: Only an empty vessel may be charged with wood

  RET_CHARGING:
    x: 300
    y: 40
    description: Loading wood. Hatches open. Lighting is interlocked in hardware.
    outputs: { ignition_burner: false, afterburner_valve: false, buffer_pump: false }
    transitions:
      - to: RET_LIGHTING
        when: hatches_closed and pyrolysis_demand and t_buffer_top < t_buffer_set and not co_alarm
        actions: { batch_no: "+1" }
        description: >-
          Four conditions at once, and that is deliberate. A cold buffer is one
          of them: a batch releases about 1000 kWh, the buffer holds 209 kWh.
          Starting with the buffer at 65 degC condemns the whole batch to the
          dump radiator.

  RET_LIGHTING:
    x: 530
    y: 40
    description: >-
      The external burner heats the charge to the self-sustaining threshold.
      The only state in this layer that can still be called off at no cost.
    outputs: { ignition_burner: true, afterburner_valve: true, buffer_pump: true }
    transitions:
      - to: RET_FAULT
        when: co_alarm or not hatches_closed
      - to: RET_COLD
        when: not pyrolysis_demand
        description: Called off — the last moment at which this still costs nothing
      - to: RET_DEVOLATILISING
        when: t_retort > t_devol_min and afterburner_flame
        description: Pyrolysis gas burns by itself — the burner can be shut down

  RET_DEVOLATILISING:
    x: 760
    y: 40
    description: >-
      Self-sustaining process. Pyrolysis gas to the afterburner, heat to the
      buffer. THERE IS NO EXIT FROM THIS STATE ON DEMAND. The batch ends when
      it ends. Flame loss in the afterburner is an immediate fault: tar and CO
      then go into the room instead of up the stack.
    outputs: { ignition_burner: false, afterburner_valve: true, buffer_pump: true }
    transitions:
      - to: RET_FAULT
        when: co_alarm or not afterburner_flame or not hatches_closed
      - to: RET_FINISHING
        when: TBD
        description: Gas evolution ceases — end of devolatilisation
        missing: >-
          The end criterion. It does not follow from the thermocouple alone.
          Retort practice relies on the afterburner flame dying out. To be
          established on the first runs — this condition is a placeholder.

  RET_FINISHING:
    x: 990
    y: 40
    description: Residual evolution. Heat recovery still worth taking.
    outputs: { ignition_burner: false, afterburner_valve: true, buffer_pump: true }
    transitions:
      - to: RET_FAULT
        when: co_alarm
      - to: RET_COOLDOWN
        when: t_retort < t_devol_min

  RET_COOLDOWN:
    x: 990
    y: 170
    description: >-
      THE BED COOLS SEALED INSIDE THE VESSEL. Opening it hot feeds oxygen to
      char with an enormous developed surface — it ignites at once.
      The exit requires BOTH conditions: temperature AND time. Time is there
      because the thermocouple reads one point, while a 200 kg charge has a
      gradient and its core stays hot longer than the probe shows.
      THIS STATE ENDS THE CARBONISATION CYCLE. What it leaves is the charcoal
      bed the gasification phase runs on — in place, not discharged.
    outputs: { ignition_burner: false, afterburner_valve: false, buffer_pump: true }
    transitions:
      - to: RET_FAULT
        when: not hatches_closed
        description: Attempt to open before time
      - to: RET_COLD
        when: t_retort < t_bed_safe
        after: t_cooldown_min
        actions: { bed: char }
        description: >-
          Temperature AND time — both, not either. Cycle over, the vessel now
          holds a charcoal bed and the gasification phase may take over.

  RET_FAULT:
    x: 300
    y: 170
    fault: true
    description: >-
      Burner OFF, heat to the dump radiator, call a human.
      AND THAT IS ALL THIS FAULT STATE CAN DO. If it was entered from
      RET_DEVOLATILISING the process continues regardless — the controller
      stops steering it but does not stop it. This is not a flaw in the
      skeleton, it is a property of batch pyrolysis, and it is why the entry
      conditions into RET_LIGHTING are as hard as they are.
    outputs: { ignition_burner: false, afterburner_valve: true, buffer_pump: true, dump_radiator: true }
    transitions:
      - to: RET_COLD
        when: reset and not co_alarm and t_retort < t_bed_safe

# =====================================================================
#  WHAT THIS SKELETON DOES NOT YET HANDLE — stated openly
# =====================================================================
gaps:
  - >-
    COOLING DOWN ONLY TO LIGHT IT AGAIN. The carbonisation cycle ends by cooling
    the bed, and the gasification phase then heats the same bed back up. That
    throws away the sensible heat of a 200 kg charge. It may well be the right
    call for safety and for a clean phase boundary, but it is a deliberate cost
    and nobody has priced it yet. The alternative — handing over hot, with no
    cooldown — removes the clean boundary and needs its own interlock.
    QUESTION FOR THE BUILD, not for the model.
  - >-
    NON-VOLATILE MEMORY. The genset needs no memory across restarts — here
    `bed` and `batch_no` must survive a power cut. Losing `bed` is the dangerous
    one: a controller that forgets whether the vessel holds wood or char can
    light the wrong phase.
  - >-
    WHERE THE HOPPER FITS. The CXF has a 5 kg charcoal hopper, which suits a
    gasifier fed from a store. In a vessel gasifying its own bed it is not
    obvious whether the hopper still feeds anything, or whether `hopper_low`
    is a signal this machine has at all. To confirm against the hardware.
  - >-
    THE END-OF-DEVOLATILISATION CRITERION. The condition in RET_DEVOLATILISING
    is a placeholder, to be established by measurement on the first runs.
  - >-
    CXF SHUTDOWN PROCEDURE. The branch is left open deliberately — (a) and (b)
    carry opposite risks and this is a question for ThriveOffgrid.
  - >-
    HYDROGEN. A CO detector does not see H2, and water gas is 28 % H2. The
    safeguard is gravity ventilation from the highest point of the room, not any
    sensor listed here. That is a BUILDING requirement, not a programming one,
    which is why it appears in no transition.
  - >-
    THERMAL COUPLING OF TWO SOURCES. The retort and the gasifier can both heat
    the buffer at once and will overfill it together. Settling the buildings'
    heat demand is a precondition for designing any priority between them.
</script>

.plotno::-webkit-scrollbar{width:7px;height:7px}

/* Trzy karty pod diagramem: wyjścia, stan bieżący, dziennik.
   Wejść tu już nie ma — stoją obok, na pełną wysokość.
   „Stan bieżący" dostaje najwięcej szerokości, bo niesie opis stanu i listę
   przejść z opisami, czyli najdłuższą treść z tej trójki. */

<style>

  <div class="modal-box">
    <header><h1 data-i18n="modal.title">State machine definition</h1>

    <div class="blad" id="blad"></div>

    <div class="modal-stopka">
      <button id="bZastosuj" class="stop" data-i18n="btn.apply">Apply</button>
      <button id="bPrzywroc" data-i18n="btn.restore">Restore original</button>
    </div>
