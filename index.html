<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genset controller simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231A2332'/><text x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='700' fill='%23F7A800'>⚙</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script id="defaultYaml" type="text/yaml">
name: Genset controller FOGO FH9000R — SMARTBOB SM-MINI-0808R
description: >
  Models the GENSET ONLY. Reads the Deye G-start dry contact, cranks with an
  attempt limit, stops the engine by shorting the ignition to ground once the
  signal drops. No gasifier here — no blower, no gas valve, no bed state.
  A cycle opens on the Deye signal and closes on the return to ready.

  NAMING CONVENTION: states in this layer carry the GENS_ prefix (aggregate).
  Further layers get their own: GAZ_ for the gasifier, RET_ for the retort.
  Without it GENS_RUNNING and GAZ_RUNNING would collide once the machines
  stand side by side — a running engine and a reactor producing gas are not
  the same state.

genset:
  model: FOGO FH9000R
  datasheet: https://www.fogo.pl/fh-9000-r
  engine: Honda GX390
  note: >-
    8.5 kVA, 400/230 V three-phase, AVR on all three phases. The electric
    starter, the relay start input and the battery are retrofits — the vendor
    page does not list them, which is why the start signal has to be wired
    rather than requested over a bus.

controller:
  model: SMARTBOB SM-MINI-0808R
  datasheet: https://smartbob.pl/produkt/sm-mini-0808r/
  documentation: https://smartbobautomatyka.github.io/SmartbobPageWiki/
  templates: https://github.com/SmartbobAutomatyka/SmartbobAutomatyka-GIT/tree/main/ESPHOME/SM-MINI-0808R-V17
  pinout: https://docs.google.com/spreadsheets/d/1f-NrrFuqd2Pu4SJJxyYbYXiO_AjEefHKa8IfUKU8CmM/edit?gid=1302523101

parameters:
  # The Deye request must be continuously ON for this long before the logic
  # accepts it. It lives in the INPUT FILTER, not in a state: holding a signal
  # is signal conditioning, and a state timer cannot express it — a state timer
  # measures time in the state, which has already elapsed while the controller
  # sat idle. Same thing as `delayed_on` on the ESPHome binary_sensor.
  t_request_hold: 5      # s
  # Minimum dwell in GENS_READY after a closed cycle or a fault reset, so the
  # controller never cranks again the instant the engine has stopped.
  # This one is correctly measured as time in the state.
  t_ready: 5             # s
  # Ignition must be live BEFORE the starter turns the engine over, or the first
  # compression strokes can happen while the interposing relay is still settling
  # — the engine turned without spark, battery spent, one attempt wasted.
  # This is a property of the OUTPUT, not a state: see `delay_on` on the starter.
  # Same reasoning as the request hold, which lives in the input filter rather
  # than in a state timer.
  t_prestart: 1          # s — ignition live before the starter is energised
  # Whole attempt window: t_prestart of ignition settling plus the cranking
  # itself, so the starter still turns for three seconds.
  t_attempt: 4           # s
  t_pause: 10            # s — starter rest between attempts
  attempts_max: 3
  t_rundown: 10          # s — time allowed for the engine to come to a stop
  # How long the ignition is held shorted to ground when stopping. A button is
  # not enough: a single-cylinder engine can ride through a brief short and keep
  # running, so the duration cannot depend on how long somebody holds a button.
  # The relay holds it, and the state machine holds the relay.
  t_kill: 3              # s

counters:
  attempts: 0

# =====================================================================
#  MEASUREMENTS — analogue quantities the simulator models and displays.
#
#  None of these is an input to the state machine. They exist because a state
#  name alone does not tell you whether the plant is healthy, and because two
#  of them explain limits that otherwise look arbitrary:
#  `u_gen` is the quantity the IN-02 voltage relay actually watches, and
#  `u_batt` is why cranking has an attempt budget at all.
#
#  `model` names the behaviour the simulator implements for each one.
# =====================================================================
measurements:
  u_gen:
    label: Genset phase voltage
    unit: V
    min: 0
    max: 440
    ok_from: 360
    ok_to: 420
    model: gen_voltage
    description: >-
      What the DIN-rail voltage monitoring relay on IN-02 measures. The relay
      closes its contact inside the working window, and that contact is the
      only proof the controller has that the engine is actually producing.
  t_engine:
    label: Engine temperature
    unit: °C
    min: 0
    max: 120
    warn_above: 95
    alarm_above: 110
    model: engine_temp
    description: >-
      Air-cooled GX390. Climbs under load, falls when stopped. Below 40 °C is
      where a choke would be needed — which this controller does not yet have.
  u_batt:
    label: Starter battery
    unit: V
    min: 8
    max: 15
    warn_below: 10.5
    alarm_below: 9.5
    model: starter_battery
    description: >-
      Sags hard while the starter turns and only partly recovers between
      attempts. THIS IS WHY THE ATTEMPT LIMIT EXISTS: three attempts is a
      budget, not a formality. Watch it fall across a failed start cycle.
  soc:
    label: Bank SOC
    unit: "%"
    min: 0
    max: 100
    warn_below: 25
    model: bank_soc
    description: >-
      Read from the Deye over Modbus, register 588. Falls on island load,
      rises while the genset charges. Informational only — the state machine
      acts on the G-start contact, not on SOC.
  p_pv:
    label: PV power
    unit: W
    min: 0
    max: 4500
    model: pv_power
    description: 8 x JA Solar JAM72D30-540/MB, 4.32 kWp on the barn.

# Energy chain shown in the synoptic bar, left to right.
# The chain now reads in causal order and closes a loop: the phase the genset
# produces goes back into the bank, which is what asks for it in the first place.
synoptic:
  - { id: pv,      label: PV }
  - { id: load,    label: load }
  - { id: bank,    label: bank }
  - { id: deye,    label: Deye }
  - { id: request, label: GS contact }
  - { id: engine,  label: engine }
  - { id: phase,   label: phase }

inputs:
  gen_request:
    pin: IN-01
    label: Deye start signal
    description: >-
      G-start dry contact, inverter terminals 1 and 2.
      ON = genset run requested. OFF = no request.
      The logic sees this input only after it has been held for
      {t_request_hold} s; dropping it is immediate. Asymmetric on purpose —
      a transient request must not start the engine, but a withdrawn request
      must stop the cranking at once.
    hold: t_request_hold
  running:
    pin: IN-02
    label: Run confirmed
    sound_loop: engine          # pracujący silnik, dopóki potwierdzenie trwa
    sound_on: engine-start      # kręcenie, zapłon, narost obrotów
    sound_off: engine-stop      # obroty siadają, na końcu klaknięcie zaworów
    description: >-
      External DIN-rail voltage monitoring relay wired to the genset output
      phase. Its dry contact feeds IN-02.
      ON = voltage within the working window, i.e. the genset is producing.
    device:
      name: e.g. Relpol RPN-.VF-A400
      url: https://www.relpol.pl/Produkty/Przekazniki-nadzorcze/Przekazniki-nadzorcze-modulowe/Przekazniki-nadzorcze-RPN-.VF-A400
  co_alarm:
    pin: IN-03
    label: CO alarm
    description: >-
      Alarm contact of the carbon monoxide detector in the plant room, on IN-03.
      ON = carbon monoxide detected. The detector needs a second contact for
      the hardwired permit chain, which stops the engine independently of
      the controller.
  kill_btn:
    pin: IN-05
    label: Kill button
    description: >-
      Momentary pushbutton in the cabinet door. It is a REQUEST, not the kill
      itself: pressing it sends the machine to GENS_STOPPING, which energises
      the kill relay and holds the short for {t_kill} s regardless of how long
      the button was held. Wiring the button straight into the ignition line
      means a short press leaves the engine running.
    momentary: true

  reset:
    pin: IN-04
    label: Fault reset
    description: >-
      Momentary pushbutton in the cabinet door, on IN-04.
      ON = pressed. Returns to OFF on release.
    momentary: true

outputs:
  ignition:
    pin: RELAY-01
    label: Ignition relay
    # `short` is what the indicator board shows. The board has to hold ten or
    # more relays once the gasifier and the retort arrive, so the row is one
    # line and the full label lives in the tooltip.
    short: IGNITION
    description: >-
      ON = the NC contact in the kill line is open, ignition circuit live.
      OFF = ignition shorted to ground, engine stopped.
  starter:
    pin: RELAY-02
    label: Starter relay
    short: STARTER
    # Energising is held off this long after the state asks for it; dropping is
    # immediate. The ignition relay closes first and settles, then the starter
    # turns. Asymmetric for the same reason the request filter is.
    delay_on: t_prestart
    # Dźwięk deklarowany w danych, nie wpisany w kod symulatora: `sound_loop`
    # gra, dopóki sygnał jest aktywny. Dzięki temu dmuchawa gazogeneratora
    # dostanie swój głos przez dopisanie jednej linii i pliku.
    sound_loop: starter
    description: >-
      Drives the starter contactor coil; it does not feed the starter directly.
      ON = contactor closed, starter cranking. OFF = contactor open.

  kill:
    pin: RELAY-03
    label: Kill relay
    short: KILL
    description: >-
      ENERGISE-TO-STOP, and deliberately the opposite polarity to the ignition
      relay. Energised, its contact shorts the ignition to ground: a positive,
      timed kill. It is NOT the inverse of the ignition relay — it is energised
      only while the engine is being stopped and in a fault, not while idle.
      When idle the NC contact of the de-energised ignition relay already holds
      the short, and keeping a second coil energised for hours would waste power
      and wear it for nothing.
      The two paths are independent on purpose: one fails safe on loss of power,
      the other acts positively on command.

states:
  GENS_READY:
    x: 70
    y: 40
    description: >-
      Controller powered, outputs in the safe state. Kill line shorted to
      ground. Two independent conditions gate the start, on two different
      clocks: the request must have been held {t_request_hold} s (input filter)
      AND the controller must have been in this state {t_ready} s (state timer).
      The second one matters only right after a cycle or a fault reset; once
      the controller has stood idle it is long satisfied, and that is correct —
      a rested engine needs no dwell. The `not running` term blocks the start
      if the engine is somehow still turning.
    outputs: { ignition: false, starter: false, kill: false }
    actions: { attempts: 0 }
    transitions:
      - to: GENS_CRANKING
        when: gen_request and not co_alarm and not running
        after: t_ready
        description: Request {t_request_hold} s, dwell {t_ready} s — crank
  GENS_CRANKING:
    x: 300
    y: 40
    description: Starter engaged. The time limit protects the bendix.
    outputs: { ignition: true, starter: true, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_STOPPING
        when: not gen_request
        description: Deye signal lost
      - to: GENS_RUNNING
        when: running
        description: Run confirmed
      - to: GENS_FAULT
        after: t_attempt
        when: attempts >= attempts_max - 1
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max} failed — limit reached"
      - to: GENS_PAUSE
        after: t_attempt
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max} failed — pause {t_pause} s"
  GENS_PAUSE:
    x: 300
    y: 170
    description: Starter thermal rest before the next attempt.
    outputs: { ignition: true, starter: false, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_RUNNING
        when: running
        description: Run confirmed
      - to: GENS_READY
        when: not gen_request
        description: Deye signal lost — cycle aborted
      - to: GENS_CRANKING
        after: t_pause
        description: "Pause {t_pause} s elapsed — next attempt"
  GENS_RUNNING:
    x: 530
    y: 40
    description: Engine running, inverter charging the bank.
    outputs: { ignition: true, starter: false, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_FAULT
        when: not running
        description: Run confirmation lost without command
      - to: GENS_STOPPING
        when: not gen_request
        description: Deye signal lost
  GENS_STOPPING:
    x: 530
    y: 170
    description: Ignition relay OFF — the NC contact shorts the ignition to ground.
    outputs: { ignition: false, starter: false, kill: true }
    transitions:
      # OBA warunki. Zwolnienie w chwili, gdy silnik przestaje się kręcić,
      # czyniłoby gaszenie tak krótkim jak naciśnięcie, które o nie poprosiło —
      # a po to ten przekaźnik istnieje, żeby tego uniknąć.
      - to: GENS_READY
        when: not running
        after: t_kill
        description: Stopped, short held {t_kill} s
      - to: GENS_FAULT
        after: t_rundown
        description: "Run confirmation held {t_rundown} s — kill circuit fault"
  GENS_FAULT:
    x: 70
    y: 170
    fault: true
    description: >-
      Ignition relay OFF. Requires a manual reset. Resetting is blocked while
      run confirmation persists — that would mean a defective kill circuit.
    outputs: { ignition: false, starter: false, kill: true }
    transitions:
      - to: GENS_READY
        when: reset and not co_alarm and not running
        description: Fault reset
</script>
<script id="plantYaml" type="text/yaml">
name: Installation — the world the controller sits in
description: >
  Separate from state-machine.yaml on purpose. That file is the CONTROLLER:
  what gets flashed, what acts on contacts. This file is the PLANT around it:
  the bank, the PV, the loads, and the inverter that decides when to ask for
  the genset. The controller must know nothing of what is in here — it reads a
  dry contact and that is all.

  WHY THIS FILE EXISTS. Until now `gen_request` was a free input you toggled by
  hand. It is not an input at all: it is an OUTPUT of the Deye, computed from
  battery SOC with hysteresis. Toggling it modelled the wrong layer. The real
  chain is a feedback loop:

      cells -> BMS (SOC estimate) -> Deye (Start threshold) -> GS contact
            -> IN-01 -> GENS_ -> genset -> GEN port -> charges the bank -> cells

# =====================================================================
#  HARDWARE — figures from the installation, not invented
# =====================================================================
bank:
  capacity_kwh: 16.1
  nominal_v: 51.2
  note: ONVOLT, 16 x 314 Ah Welion Semi Solid, JK BMS 200 A
  caveat: >-
    SOC is modelled over the full capacity. The real bank is a LiFePO4 pack
    whose usable window is narrower, and whose SOC comes from a BMS ESTIMATOR
    that needs several full cycles to calibrate. Treat displayed SOC as the
    number the Deye sees, not as the energy actually left.

pv:
  kwp: 4.32
  note: 8 x JA Solar JAM72D30-540/MB, bifacial, on the barn

genset:
  kw_gas: 3.5
  kw_petrol: 5.6
  note: >-
    FOGO FH9000R. 5.6 kW on petrol, about 3.5 kW on water gas after the
    30-40 % derate. The gas figure is the one that matters in service.

loads:
  base_kw: 0.5
  shower_kw: 9.0
  shower_minutes: 8
  note: >-
    0.5 kW is 12 kWh/day averaged out. The shower is the PPE3 at its 9 kW
    setting — the binding constraint of the whole installation, and the reason
    the microswitches must be moved off 15 kW before the first island run.

# =====================================================================
#  DEYE — the device that decides. These are INVERTER SETTINGS, not ours.
# =====================================================================
deye:
  gen_start_soc: 30        # manual default. "Start = 30%": at this SOC the
                           # normally-open Gen Signal relay closes.
  gen_stop_soc: 80         # TO BE READ OFF THE DEVICE — the manual states the
                           # start threshold plainly but not the stop one.
  # Surplus thresholds that separate PV from PV_CHARGING. Two values, not one,
  # because a single threshold makes the status flap when PV sits on it.
  p_surplus_on: 120        # W — above this the surplus is called charging
  p_surplus_off: 80        # W — below this it is not
  gen_charge_a: 40         # manual default. At 51.2 V that is about 2.05 kW,
                           # which is LESS than the 3.5 kW the genset makes.
                           # Left at the default deliberately: the question of
                           # what it should be is open and has to be settled on
                           # the inverter, against what the cells accept through
                           # the BMS and what the three-phase genset can give.
                           # The simulator shows the cost: genset load factor.
  island_mode: true
  contact: GS
  contact_note: >-
    Which terminal carries the start signal depends on the "Signal ISLAND MODE"
    setting. Ticked, it is GS; unticked, GV. Island mode is on here, so GS —
    which matches the G-start (1,2) pair in our wiring. Confirm on the device.

# =====================================================================
#  TIME — two clocks, and why
#
#  A full cycle is about 19 hours: roughly 16 h draining the bank and 3 h
#  charging it. The state machine runs in real seconds (t_crank is 3 s).
#  One clock cannot serve both.
#
#  So the plant clock runs fast while nothing is happening and drops to real
#  time the moment the controller has something to show. The multiplier is
#  always displayed — a hidden variable clock is worse than a slow one.
# =====================================================================
clock:
  warp: 240                # 1 s of simulation = 4 min of plant, while idle
  realtime_states: [GENS_CRANKING, GENS_PAUSE, GENS_STOPPING, GENS_FAULT]
  realtime_on_request: true   # also drop to 1x as soon as the request appears,
                              # so the request hold and the ready dwell are
                              # watchable. IN GENS_READY ONLY: the request stays
                              # asserted for the whole charging run, and without
                              # that restriction the clock sat at 1x for hours
                              # of charging and gave back half the benefit.

# =====================================================================
#  MEASUREMENTS of the plant, merged with those of the controller.
# =====================================================================
measurements:
  p_load:
    label: Island load
    unit: W
    min: 0
    max: 10000
    model: plant
    description: Base load plus the PPE3 shower when it runs. 9 kW on three phases.
  p_bank:
    label: Bank power
    unit: W
    min: -6000
    max: 6000
    model: plant
    description: Positive charges the bank, negative discharges it. This is what moves SOC.
  gen_load:
    label: Genset load factor
    unit: "%"
    min: 0
    max: 100
    warn_below: 70
    model: plant
    description: >-
      How much of the genset's output is actually used. The Deye caps charging
      at gen_charge_a, so with only the base load running the genset can be left
      at well under full load — which is precisely what a gasifier does not want.
      This gauge is here to answer that open question with a number.

# =====================================================================
#  DEYE_ — the inverter as a state machine. The contact is closed in
#  DEYE_REQUEST and DEYE_CHARGING, open in the other two.
#
#  THE HYSTERESIS IS THE POINT. Start 30 %, stop 80 %. Without the gap the
#  genset would chatter around the threshold — the same class of defect as the
#  two clocks in the start logic, and just as invisible until it is drawn.
# =====================================================================
states_deye:
  DEYE_PV:
    description: >-
      PV covers the loads, but with no surplus worth speaking of: the bank is
      floating rather than charging. The genset contact is open.
    contact: false
  DEYE_PV_CHARGING:
    description: >-
      PV covers the loads AND charges the bank with the surplus. This is where
      the installation should spend the summer, and it is worth telling apart
      from bare PV: covering the load is not the same as filling the bank.
      Entering needs more than p_surplus_on, leaving less than p_surplus_off —
      a deadband, or the status would flap either side of the threshold.
    contact: false
  DEYE_DISCHARGING:
    description: >-
      No surplus. The bank carries the load and SOC falls. Still no request —
      this is normal night-time operation, not a fault. Named to pair with
      DEYE_CHARGING: the two are the same quantity with opposite sign.
    contact: false
  DEYE_REQUEST:
    description: >-
      SOC reached the Start threshold, the normally-open Gen Signal relay has
      closed, and the Deye is waiting for voltage on the GEN port. The bank
      keeps draining in the meantime: asking is not the same as being helped.
    contact: true
  DEYE_CHARGING:
    description: >-
      The genset is producing and the Deye is charging the bank through the GEN
      port, current-limited by gen_charge_a. The contact stays closed until the
      stop threshold, because releasing it at the start threshold would stop the
      genset the instant it began to help.
    contact: true
</script>

   Wejść tu już nie ma — stoją obok, na pełną wysokość.

// ---------------------------------------------------------------------
//  Język. Kanoniczne teksty siedzą w YAML-u po angielsku; I18N.pl.yaml

let LANG='pl';
function T(k){
  const a=(I18N[LANG]||{}).ui||{}, b=I18N.en.ui;
  return a[k]!==undefined ? a[k] : (b[k]!==undefined ? b[k] : k);
}
function TY(sciezka, oryg){
  const a=(I18N[LANG]||{}).yaml||{};
  return a[sciezka]!==undefined ? a[sciezka] : oryg;
}
function zapiszJezyk(l){ try{ localStorage.setItem('lang',l); }catch(e){} }
function czytajJezyk(){
  try{ const l=localStorage.getItem('lang'); if(l==='pl'||l==='en') return l; }catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('pl') ? 'pl' : 'en';
}
function ustawJezyk(l){
  LANG=l;
  document.documentElement.lang=l;
  document.title=T('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{ e.textContent=T(e.dataset.i18n); });

  const lg0=document.getElementById('log'); if(lg0) lg0.title=T('log.copyHint');
  const bdz=document.getElementById('bDzwiek');
  if(bdz) bdz.title=T(dzwiekWl?'sound.on':'sound.off');
  document.querySelectorAll('.jezyk button').forEach(b=>b.classList.toggle('akt',b.dataset.lang===l));
  zapiszJezyk(l);
  if(M){ naglowek(); rysujWejscia(); cacheWy=null; cacheLic=null; cachePom=null;
         const sy=document.getElementById('synoptyka'); if(sy) sy.innerHTML='';
         ostatniStan=null; ostatniSvg=''; rysujDziennik(); odswiez(); }
}

const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let zrodloOryg='';
let stanIdle='', cyklStart=null, cyklOstatni=null, cykle=0;
let modelSilnika=true, czasZaskoku=null, czasZgaszenia=null;

let weF={}, holdT={};                  // wartości po filtrze przytrzymania i ich zegary

let M=null, stan=null, t=0, wStanie=0, we={}, lic={}, gra=false, petla=null, zrodlo='';
// warstwy: GENS_ jest maszyną żywą, GAZ_ i RET_ to szkielet z hybrid-skeleton.yaml,
// rysowany poglądowo. Szkielet nie ma sygnałów ani parametrów, więc go nie symulujemy —
// `gotowe()` nie jest na nim wywoływane i żaden węzeł nie jest „bieżący".

function wyrazenie(txt){
  return String(txt)
    .replace(/\bnot\b/g,'!').replace(/\band\b/g,'&&').replace(/\bor\b/g,'||');
}
function ocen(txt, zakr){
  if(txt===undefined||txt===null) return true;
  try{
    const k=Object.keys(zakr), v=k.map(x=>zakr[x]);
    return !!(new Function(...k, 'return ('+wyrazenie(txt)+')'))(...v);
  }catch(e){ return false; }

// logika widzi weF (po filtrze), nie we (stan fizyczny pinu)
function zakres(){ return Object.assign({}, weF, lic, M.parameters||{}); }

// --- filtr przytrzymania wejścia ------------------------------------
// Odpowiednik `delayed_on` na binary_sensorze w ESPHome. Zbocze ON wymaga
// utrzymania sygnału; zbocze OFF jest natychmiastowe. Tego NIE DA SIĘ
// wyrazić zegarem stanu — zegar stanu mierzy czas w stanie, który zdążył
// upłynąć, póki sterownik stał bezczynnie.
function limitHold(k){
  const h=((M.inputs||{})[k]||{}).hold;
  if(h===undefined||h===null) return null;
  return (typeof h==='string') ? (M.parameters||{})[h] : h;
}
function filtrKrok(dt){
  for(const k in (M.inputs||{})){
    const lim=limitHold(k);
    if(lim===null||lim===undefined){ weF[k]=!!we[k]; holdT[k]=0; continue; }
    if(!we[k]){ weF[k]=false; holdT[k]=0; }
    else if(!weF[k]){ holdT[k]=(holdT[k]||0)+dt; if(holdT[k]>=lim){ weF[k]=true; } }
  }
}

function naglowek(){
  const g=M.genset||{}, st=M.controller||{};
  let pod=esc(M.name||'');
  if(st.model && st.datasheet){
    pod=pod.replace(esc(st.model),
      '<a href="'+esc(st.datasheet)+'" target="_blank" rel="noopener">'+esc(st.model)+'</a>');
  }
  if(g.model && g.datasheet){
    pod=pod.replace(esc(g.model),
      '<a href="'+esc(g.datasheet)+'" target="_blank" rel="noopener">'+esc(g.model)+'</a>');
  }
  document.getElementById('podtytul').innerHTML=pod;
  const lk=document.getElementById('linkiSter');
  if(lk){
    const poz=[['documentation','link.documentation'],['templates','link.templates'],['pinout','link.pinout']];
    let h = poz.filter(([k])=>st[k])
      .map(([k,tk])=>'<a href="'+esc(st[k])+'" target="_blank" rel="noopener">'+esc(T(tk))+'</a>').join('');
    if(g.datasheet) h += '<a href="'+esc(g.datasheet)+'" target="_blank" rel="noopener">'+esc(g.model||'genset')+'</a>';
    lk.innerHTML = h;
  }
}

function zaladuj(txt){
  const d = jsyaml.load(txt);
  if(!d || !d.states) throw new Error(T('err.noStates'));
  M=d; zrodlo=txt;
  naglowek();
  // stan instalacji MUSI istnieć przed rysowaniem wejść: suwaki czytają
  // INST.load_kw przy budowie, a resetuj() woła się dopiero niżej
  resetPomiary(); resetInstalacji();
  rysujWejscia();
  resetuj();
}
function resetuj(){
  stanIdle = Object.keys(M.states)[0];
  stan = stanIdle; t=0; wStanie=0;
  cyklStart=null; cyklOstatni=null; cykle=0;
  czasZaskoku=null; czasZgaszenia=null;
  cacheWy=null; cacheLic=null; ostatniStan=null; ostatniSvg='';
  resetPomiary(); resetInstalacji(); cachePom=null;
  we={}; for(const k in (M.inputs||{})) we[k] = !!M.inputs[k].default;
  weF={}; holdT={}; filtrKrok(0);
  lic={}; for(const k in (M.counters||{})) lic[k]=M.counters[k];
  // migawka startowa — bez niej pierwszy tick zgłosiłby wszystkie piny jako zmienione
  poprzWe={}; for(const k in (M.inputs||{})) poprzWe[k]=!!we[k];
  poprzF={};  for(const k in (M.inputs||{})) poprzF[k]=!!weF[k];
  wyEf={}; opoznWy={}; krokWyjsc(0);
  poprzWy={}; const w0=wyjsciaTeraz();
  for(const k in (M.outputs||{})) poprzWy[k]=!!w0[k];
  wszystkiePetleWyl();
  DZIENNIK.length=0; document.getElementById('log').innerHTML='';
  dopisz({typ:'reset',kl:'s'});
  odswiez();
}
// ---------------------------------------------------------------------
//  DZIENNIK ZDARZEŃ — przechowywany jako DANE, nie jako gotowy tekst.
//  Gdyby wiersze były tekstem, zostawałyby w języku z chwili zdarzenia
//  i po przełączeniu języka dziennik byłby dwujęzyczny.
//
//  PUŁAPKA: podstawienia `{attempts}` muszą być ZAMROŻONE w chwili zdarzenia.
//  Licznik prób rośnie w trakcie cyklu, więc podstawienie z aktualnych wartości
//  pokazałoby w starym wierszu nowy stan licznika. Dlatego każdy wpis niesie
//  własną migawkę `snap`.
//
//  Wstawianie pojedynczego wiersza NIE przebudowuje listy — pełna przebudowa
//  jest tylko przy zmianie języka. Inaczej wrócilibyśmy do kasowania zaznaczenia
//  tekstu dziesięć razy na sekundę.
// ---------------------------------------------------------------------
const DZIENNIK=[], LIMIT_DZ=500;
// Numer rosnący, nie pozycja na liście. Wpisy dochodzą OD GÓRY, więc przy
// pasach opartych o nth-child parzystość przeskakiwałaby przy każdym zdarzeniu
// i całe tło migałoby. Numer przypisany raz zostaje z wpisem na zawsze.
let nrWpisu=0;
function migawka(){ return Object.assign({}, lic, M?M.parameters:{}); }
function podstawZ(s, snap){
  return String(s).replace(/\{(\w+)\}/g,(m,k)=> (snap&&snap[k]!==undefined) ? snap[k] : m);
}
// Format diagnostyczny, nie narracyjny. Bez nawiasów, kropek rozdzielających
// i myślników ozdobnych — serwisant ma czytać zdarzenia, a nie interpunkcję.
// Strzałki ▲ ▼ zostają, bo niosą treść: zbocze narastające i opadające.
// Czas wyrównany DO LEWEJ, dopełniony do stałej szerokości, żeby kolumny stały.
function pinIEtyk(grupa,k){
  const o=(M[grupa]||{})[k]||{};
  return { pin:(o.pin||k), etyk:etykPinu(grupa,k) };
}
function tekstWpisu(e){
  switch(e.typ){
    case 'reset': return T('log.reset');
    case 'pin': {
      const o=pinIEtyk(e.grupa,e.k);
      return (e.v?'▲ ':'▼ ')+o.pin+' '+(e.v?'ON':'OFF')+'  '+o.etyk;
    }
    case 'filtr': {
      const o=pinIEtyk(e.grupa,e.k);
      return (e.v?'▲ ':'▼ ')+o.pin+' '+(e.v?'ON':'OFF')+'  '+o.etyk+' '+T('log.filter');
    }
    case 'przejscie': {
      const p=((M.states[e.z]||{}).transitions||[])[e.i];
      const op = p ? opisPrzejscia(e.z,e.i,p) : '';
      return e.z+' > '+e.cel+(op?'  '+podstawZ(op,e.snap):'');
    }
    case 'deye':  return e.z+' > '+e.cel+'  '+
      ((PL&&PL.states_deye[e.cel]&&PL.states_deye[e.cel].contact) ? 'GS ON' : 'GS OFF');
    case 'cykl':  return T('log.cycleClosed')+' '+e.s+' s';
    case 'model': return e.co==='catch' ? T('log.catch')+' '+e.s+' s' : T('log.'+e.co);
    default: return e.txt||'';
  }
}
function wierszDz(e){
  const tr=tekstWpisu(e);
  return '<span class="t">'+e.t.toFixed(1).padEnd(7)+'</span>'+
    (e.kl?'<span class="'+e.kl+'">'+esc(tr)+'</span>':esc(tr));
}
// Czysty tekst całego dziennika — to idzie do schowka
function tekstDziennika(){
  return DZIENNIK.map(e=>e.t.toFixed(1).padEnd(7)+tekstWpisu(e)).join('\n');
}
function dopisz(e){
  e.t=t; e.nr=++nrWpisu;
  DZIENNIK.unshift(e); if(DZIENNIK.length>LIMIT_DZ) DZIENNIK.length=LIMIT_DZ;
  const el=document.getElementById('log');
  const d=document.createElement('div');
  if(e.nr%2) d.className='par';
  d.innerHTML=wierszDz(e);
  el.insertBefore(d, el.firstChild); el.scrollTop=0;
  while(el.childNodes.length>LIMIT_DZ) el.removeChild(el.lastChild);
}
function rysujDziennik(){        // pełna przebudowa — tylko przy zmianie języka
  const el=document.getElementById('log');
  el.innerHTML=DZIENNIK.map(e=>'<div'+(e.nr%2?' class="par"':'')+'>'+wierszDz(e)+'</div>').join('');
  el.scrollTop=0;
}
function podstaw(s){
  return String(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(lic[k]!==undefined) return lic[k];
    if(M.parameters && M.parameters[k]!==undefined) return M.parameters[k];
    return m;
  });
}
function linkUrzadzenia(o,sciezka){
  const u=o.device;
  if(!u||!u.url) return '';
  const nazwa = TY(sciezka+'.device.name', u.name) || T('word.datasheet');
  return '<a class="urz" href="'+esc(u.url)+'" target="_blank" rel="noopener">'+
         esc(nazwa)+' &#8599;</a>';
}
function etykPinu(grupa,k){
  const o=(M[grupa]||{})[k]||{};
  return TY(grupa+'.'+k+'.label', o.label||k);
}
function opisPinu(grupa,k){
  const o=(M[grupa]||{})[k]||{};
  return (o.pin? o.pin+' ' : '')+etykPinu(grupa,k);
}
function logujZmianyWe(){
  for(const k in (M.inputs||{})){
    const v=!!we[k];
    if(poprzWe[k]!==v){ poprzWe[k]=v;
      dopisz({typ:'pin',grupa:'inputs',k:k,v:v,kl:v?'pu':'pd'});
      dzwiekPinu('inputs', k, v); }
  }
}
// zmiana po filtrze to osobne zdarzenie od zmiany na pinie — i osobny wiersz
function logujZmianyFiltr(){
  for(const k in (M.inputs||{})){
    if(limitHold(k)===null||limitHold(k)===undefined) continue;
    const v=!!weF[k];
    if(poprzF[k]!==v){ poprzF[k]=v;
      dopisz({typ:'filtr',grupa:'inputs',k:k,v:v,kl:v?'pu':'pd'}); }
  }
}
function logujZmianyWy(){
  const wy=wyjsciaTeraz();
  for(const k in (M.outputs||{})){
    const v=!!wy[k];
    if(poprzWy[k]!==v){ poprzWy[k]=v;
      dopisz({typ:'pin',grupa:'outputs',k:k,v:v,kl:v?'pu':'pd'});
      graj(v?'relay-on':'relay-off', 0.85);   // styk słychać tak jak w szafie
      dzwiekPinu('outputs', k, v);
    }
  }
}
function jestAwaria(k){ return !!((M.states[k]||{}).fault); }
// Wyjścia ZADEKLAROWANE przez stan — czego stan chce.
function wyjsciaStanu(){ return (M.states[stan]||{}).outputs || {}; }

// Wyjścia RZECZYWISTE — co jest na cewkach. Różnią się, gdy wyjście ma
// `delay_on`: zapłon musi się ustalić, zanim ruszy rozrusznik. Zbocze
// narastające czeka, opadające działa natychmiast — ta sama asymetria co
// w filtrze wejścia, i z tego samego powodu.
let wyEf={}, opoznWy={};
function limitOpoznienia(k){
  const d=((M.outputs||{})[k]||{}).delay_on;
  if(d===undefined||d===null) return null;
  return (typeof d==='string') ? (M.parameters||{})[d] : d;
}
function krokWyjsc(dt){
  const dekl=wyjsciaStanu();
  for(const k in (M.outputs||{})){
    const chce=!!dekl[k], lim=limitOpoznienia(k);
    if(lim===null||lim===undefined){ wyEf[k]=chce; opoznWy[k]=0; continue; }
    if(!chce){ wyEf[k]=false; opoznWy[k]=0; }
    else if(!wyEf[k]){ opoznWy[k]=(opoznWy[k]||0)+dt; if(opoznWy[k]>=lim) wyEf[k]=true; }
  }
  return wyEf;
}
function wyjsciaTeraz(){ return wyEf; }
function opisStanu(k){ return TY('states.'+k+'.description', (M.states[k]||{}).description||''); }
function opisPrzejscia(k,i,p){ return TY('states.'+k+'.transitions.'+i+'.description', p.description||''); }

function zastosujAkcje(a){
  if(!a) return;
  for(const k in a){
    const v=a[k];
    if(typeof v==='string' && /^[+-]/.test(v)) lic[k]=(lic[k]||0)+parseFloat(v);
    else lic[k]=v;
  }
}
function gotowe(p){
  const z=zakres();
  if(p.when!==undefined && !ocen(p.when,z)) return false;
  if(p.after!==undefined){
    const lim = (typeof p.after==='string') ? (M.parameters||{})[p.after] : p.after;
    if(wStanie < lim) return false;
  }
  return true;
}
// =====================================================================
//  MODEL WIELKOŚCI ANALOGOWYCH
//
//  Żadna z nich nie wchodzi do maszyny stanów — maszyna działa na stykach.
//  Są tu, bo sama nazwa stanu nie mówi, czy instalacja jest zdrowa, a dwie
//  z nich tłumaczą ograniczenia, które inaczej wyglądają na wzięte z sufitu:
//  `u_gen` to wielkość, którą realnie mierzy przekaźnik nadzoru na IN-02,
//  a `u_batt` to powód, dla którego liczba prób rozruchu jest budżetem.
// =====================================================================
let POM={};
function resetPomiary(){
  POM={ u_gen:0, t_engine:18, u_batt:12.8, soc:46, p_pv:0,
        p_load:0, p_bank:0, gen_load:0 };
}

// =====================================================================
//  DŹWIĘK — syntezowany, bez plików, bo strona ma działać z file://
//
//  Ma informować, nie ozdabiać: krótki, cichy ton na każdym przejściu stanu,
//  żeby dało się pilnować instalacji nie patrząc w ekran. Wysokość bierze się
//  z POZYCJI stanu w tablicy, a awaria z flagi `fault` — tak samo jak reszta
//  silnika, który nie rozpoznaje stanów po nazwie.
// =====================================================================
let AUDIO=null, dzwiekWl=false, ostatniTon=0;
// Pliki mp3 są projektowane (gen-sounds.py), nie znalezione — dzięki temu nie
// ciągną za sobą cudzej licencji na publiczne repo i dają się odtworzyć ze
// skryptu. Synteza niżej zostaje jako zapas: gdyby katalog sounds/ nie dojechał
// albo przeglądarka odmówiła, dźwięk nadal jest, tylko prostszy.
const DZW={};
function graj(nazwa, glosno){
  if(!dzwiekWl || !nazwa) return false;
  let w=DZW[nazwa];
  if(w===undefined){
    const a=new Audio('sounds/'+nazwa+'.mp3'); a.preload='auto';
    w={el:a, ok:true};
    a.addEventListener('error', ()=>{ w.ok=false; });
    DZW[nazwa]=w;
  }
  if(!w.ok) return false;
  try{
    const a=w.el.cloneNode();
    a.volume=Math.max(0, Math.min(1, glosno===undefined?0.5:glosno));
    const pr=a.play();
    if(pr && pr.catch) pr.catch(()=>{ w.ok=false; });
    return true;
  }catch(e){ w.ok=false; return false; }
}
function wczytajDzwieki(){
  ['gens','deye','fault','cycle','relay-on','relay-off',
   'engine-start','engine-stop'].forEach(k=>graj(k, 0));   // podgrzanie cache
  wczytajPetle();
}

// --- PĘTLE MASZYN ---------------------------------------------------
// Rozrusznik i silnik nie są zdarzeniami, tylko stanami, więc grają pętlą
// przez cały czas trwania. Pliki są w WAV, bo mp3 dokłada ciszę na krawędziach
// i w pętli słychać ją jako regularny klik.
const BUF={}, GRAJACE={}, ELP={};
function wczytajPetle(){
  if(!audioGotowe()) return;
  ['starter','engine'].forEach(k=>{
    if(BUF[k]!==undefined) return;
    BUF[k]=null;
    // fetch nie działa z file:// — wtedy zostaje element <audio> z loop
    fetch('sounds/'+k+'.wav').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(ab=>AUDIO.decodeAudioData(ab)).then(b=>{ BUF[k]=b; }).catch(()=>{});
  });
}
function petlaWl(k, glosno){
  if(!dzwiekWl || !k || GRAJACE[k]) return;
  if(BUF[k] && AUDIO){
    const s=AUDIO.createBufferSource(), g=AUDIO.createGain();
    s.buffer=BUF[k]; s.loop=true;
    const t0=AUDIO.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(glosno, t0+0.06);
    s.connect(g); g.connect(AUDIO.destination); s.start();
    GRAJACE[k]={s:s, g:g};
  } else {
    if(!ELP[k]){ ELP[k]=new Audio('sounds/'+k+'.wav'); ELP[k].loop=true; }
    try{ ELP[k].volume=glosno; ELP[k].currentTime=0;
         const p=ELP[k].play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    GRAJACE[k]={el:ELP[k]};
  }
}
function petlaWyl(k){
  const w=GRAJACE[k]; if(!w) return;
  delete GRAJACE[k];
  if(w.s && AUDIO){
    const t0=AUDIO.currentTime;
    try{ w.g.gain.cancelScheduledValues(t0);
         w.g.gain.setValueAtTime(Math.max(w.g.gain.value, 0.0001), t0);
         w.g.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
         w.s.stop(t0+0.13); }catch(e){}
  } else if(w.el){ try{ w.el.pause(); }catch(e){} }
}
function wszystkiePetleWyl(){ Object.keys(GRAJACE).forEach(petlaWyl); }
// Dźwięk pinu bierze się z DEKLARACJI w YAML-u, nie z nazwy w kodzie.
function dzwiekPinu(grupa, k, v){
  if(!dzwiekWl) return;
  const o=(M[grupa]||{})[k]||{};
  if(o.sound_loop){ v ? petlaWl(o.sound_loop, grupa==='outputs'?0.9:0.8) : petlaWyl(o.sound_loop); }
  if(v && o.sound_on)  graj(o.sound_on, 0.95);
  if(!v && o.sound_off) graj(o.sound_off, 0.9);
}
const SKALA=[392,440,494,523,587,659,698];   // bez półtonów, żeby się nie gryzło
function audioGotowe(){
  if(!AUDIO){
    const K=window.AudioContext||window.webkitAudioContext;
    if(!K) return false;
    try{ AUDIO=new K(); }catch(e){ return false; }
  }
  if(AUDIO.state==='suspended'){ try{ AUDIO.resume(); }catch(e){} }
  return true;
}
function ton(f, dlug, typ, glosno){
  if(!dzwiekWl || !AUDIO) return;
  const t0=AUDIO.currentTime;
  if(t0-ostatniTon < 0.05) return;            // nie serią, gdy czas przyspieszony
  ostatniTon=t0;
  const o=AUDIO.createOscillator(), g=AUDIO.createGain();
  o.type=typ||'sine'; o.frequency.setValueAtTime(f, t0);
  // Koperta jest konieczna: skok wzmocnienia słychać jako trzask na obu
  // krawędziach. 12 ms narastania i wykładnicze wybrzmienie do zera.
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(glosno||0.055, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+(dlug||0.18));
  o.connect(g); g.connect(AUDIO.destination);
  o.start(t0); o.stop(t0+(dlug||0.18)+0.03);
}
function dzwiekPrzejscia(warstwa, indeks, awaria){
  if(!dzwiekWl) return;
  if(awaria){
    if(graj('fault', 0.95)) return;
    ton(233, 0.24, 'sine', 0.16);
    setTimeout(()=>{ ostatniTon=0; ton(175, 0.34, 'sine', 0.14); }, 170);
    return;
  }
  // Zaskok nie ma osobnego dzwonka: silnik ma własny głos i sam się odzywa
  // przez `sound_on` wejścia potwierdzenia pracy.
  if(warstwa==='GENS'){ if(graj('gens', 0.8)) return; }
  else if(graj('deye', 0.7)) return;
  const f=SKALA[((indeks%SKALA.length)+SKALA.length)%SKALA.length];
  if(warstwa==='GENS') ton(f, 0.16, 'sine', 0.17);
  else                 ton(f/2, 0.24, 'triangle', 0.13);
}
function ustawDzwiek(v){
  dzwiekWl=v;
  if(v){ audioGotowe(); if(!Object.keys(DZW).length) wczytajDzwieki(); }
  else wszystkiePetleWyl();
  const b=document.getElementById('bDzwiek');
  if(b){ b.classList.toggle('gra', v); b.textContent = v ? '♪' : '♪';
         b.title=T(v?'sound.on':'sound.off'); }
  try{ localStorage.setItem('dzwiek', v?'1':'0'); }catch(e){}
}

// =====================================================================
//  INSTALACJA — bilans energii i falownik jako urządzenie decydujące.
//
//  `gen_request` NIE JEST wejściem swobodnym. Jest wyjściem Deye, policzonym
//  z SOC z histerezą. Klikanie go ręcznie modelowało nie tę warstwę, co trzeba.
//  Łańcuch jest pętlą: ogniwa → BMS → Deye → styk GS → IN-01 → GENS_ →
//  agregat → port GEN → ładowanie banku → ogniwa.
// =====================================================================
let PL=null, INST={}, modelDeye=true;
function resetInstalacji(){
  INST={ soc:62, stanDeye:'DEYE_DISCHARGING', pv_kw:0.0, load_kw:(PL?PL.loads.base_kw:0.5),
         prysznic:0, tInst:0, warp:1 };
  if(PL) POM.soc=INST.soc;
}
// Zegar zmienny: instalacja leci przyspieszona, dopóki sterownik nie ma nic
// do pokazania. Mnożnik jest zawsze wypisany — ukryty zegar zmienny jest
// gorszy od wolnego.
function warpTeraz(){
  if(!PL || !PL.clock) return 1;
  const c=PL.clock;
  if((c.realtime_states||[]).indexOf(stan)>=0) return 1;
  // Tylko w GOTOWOŚCI. Żądanie wisi przez cały czas ładowania, więc bez tego
  // warunku zegar zostawał na 1x przez godziny ładowania i kasował pół zysku.
  // Chodzi o to, żeby dało się obejrzeć przytrzymanie i postój przed rozruchem.
  if(c.realtime_on_request && stan==='GENS_READY'
     && (we.gen_request||weF.gen_request)) return 1;
  return c.warp||1;
}
function krokDeye(){
  const d=PL.deye, s=INST.stanDeye, praca=!!we.running;
  // Stan bez żądania wynika wprost z BILANSU MOCY, a nie z par przejść.
  // Trzy sytuacje, a nie dwie: pokrycie odbiorów to nie to samo co ładowanie
  // banku. Każda granica ma martwą strefę, inaczej status migocze, gdy PV
  // stoi dokładnie na progu — zdarzyło się i zasypywało dziennik.
  const nadw = POM.p_pv - POM.p_load;
  const WL = (d.p_surplus_on===undefined) ? 120 : d.p_surplus_on;
  const WYL = (d.p_surplus_off===undefined) ? 80 : d.p_surplus_off;
  const ladujePv = (s==='DEYE_PV_CHARGING') ? (nadw > WYL) : (nadw > WL);
  const pokrywa  = (s==='DEYE_PV' || s==='DEYE_PV_CHARGING')
                   ? (POM.p_pv > POM.p_load*0.95)
                   : (POM.p_pv > POM.p_load*1.05 + 30);
  const bezZadania = ladujePv ? 'DEYE_PV_CHARGING'
                   : pokrywa  ? 'DEYE_PV' : 'DEYE_DISCHARGING';
  let n=s;
  switch(s){
    case 'DEYE_PV':
    case 'DEYE_PV_CHARGING':
    case 'DEYE_DISCHARGING':
      n = (INST.soc<=d.gen_start_soc) ? 'DEYE_REQUEST' : bezZadania; break;
    case 'DEYE_REQUEST':
      // próg STOP, nie START — zwolnienie styku na progu startu zatrzymałoby
      // agregat w chwili, w której zaczął pomagać. To jest ta histereza.
      if(INST.soc>=d.gen_stop_soc) n = bezZadania;
      else if(praca) n='DEYE_CHARGING'; break;
    case 'DEYE_CHARGING':
      if(INST.soc>=d.gen_stop_soc) n = bezZadania;
      else if(!praca) n='DEYE_REQUEST'; break;
  }
  if(n!==s){
    INST.stanDeye=n;
    dopisz({typ:'deye', z:s, cel:n, kl:'s'});
    dzwiekPrzejscia('DEYE', Object.keys(PL.states_deye).indexOf(n), false);
  }
}
function modelInstalacji(dtSter){
  if(!PL) return;
  const w=warpTeraz(); INST.warp=w;
  const dt=dtSter*w;                       // sekundy instalacji
  INST.tInst+=dt;

  // PV — moc wprost z suwaka. Był tu jeszcze przebieg dobowy, przez który
  // suwak na maksimum potrafił dawać zero, bo mnożnik dnia wynosił zero.
  // Suwak ma ustawiać moc, a nie udział w czymś niewidocznym.
  POM.p_pv = INST.pv_kw*1000;

  // odbiory
  if(INST.prysznic>0) INST.prysznic=Math.max(0, INST.prysznic-dt);
  POM.p_load = INST.load_kw*1000 + (INST.prysznic>0 ? PL.loads.shower_kw*1000 : 0);

  // rozdział mocy: PV najpierw na odbiory, agregat domyka odbiory, a dopiero
  // resztą ładuje bank — i tu działa limit Gen Charge z falownika
  const praca=!!we.running;
  const pGen = praca ? PL.genset.kw_gas*1000 : 0;
  const limitChg = PL.deye.gen_charge_a * PL.bank.nominal_v;
  const pvNaOdb = Math.min(POM.p_pv, POM.p_load);
  const nadwyzkaPv = POM.p_pv - pvNaOdb;
  const brak = POM.p_load - pvNaOdb;
  const genNaOdb = Math.min(pGen, brak);
  const genDoBanku = Math.min(pGen-genNaOdb, limitChg);
  POM.gen_load = pGen>0 ? (genNaOdb+genDoBanku)/pGen*100 : 0;
  POM.p_bank = nadwyzkaPv + genDoBanku - (brak-genNaOdb);

  INST.soc = Math.max(0, Math.min(100,
    INST.soc + (POM.p_bank/1000)*(dt/3600)/PL.bank.capacity_kwh*100));
  POM.soc = INST.soc;

  krokDeye();
  // styk GS steruje wejściem IN-01, dopóki nie przejęto go ręcznie
  if(modelDeye){
    const z=!!(PL.states_deye[INST.stanDeye]||{}).contact;
    if(we.gen_request!==z) we.gen_request=z;
  }
}
function modelPomiarow(dt){
  if(!M || !M.measurements) return;
  const praca=!!we.running, kreci=!!wyjsciaStanu().starter;

  // napięcie fazy: narasta po potwierdzeniu pracy, opada po zatrzymaniu,
  // w biegu drobne tętnienie od regulacji AVR
  const celU = praca ? 400 : 0;
  POM.u_gen += (celU - POM.u_gen) * Math.min(1, dt*3.2);
  if(praca) POM.u_gen += (Math.random()-0.5)*1.8;
  if(POM.u_gen < 0.6) POM.u_gen = 0;

  // temperatura silnika chłodzonego powietrzem
  POM.t_engine += ((praca?86:18) - POM.t_engine) * dt * (praca?0.030:0.012);

  // akumulator rozrusznika — zapada pod rozrusznikiem, między próbami
  // wraca tylko częściowo, ładuje się dopiero przy pracującym silniku
  if(kreci)      POM.u_batt -= dt*0.55;
  else if(praca) POM.u_batt += (14.1 - POM.u_batt) * dt * 0.22;
  else           POM.u_batt += (12.8 - POM.u_batt) * dt * 0.08;
  POM.u_batt = Math.max(8.2, Math.min(14.4, POM.u_batt));

  // SOC, PV, odbiory i bilans liczy modelInstalacji — tu ich nie ma celowo,
  // bo to wielkości instalacji, a nie silnika.
}
function stanPomiaru(k){           // 'ok' | 'warn' | 'alarm'
  const m=wszystkiePomiary()[k], v=POM[k];
  if(!m) return 'ok';
  if(m.alarm_above!==undefined && v>=m.alarm_above) return 'alarm';
  if(m.alarm_below!==undefined && v<=m.alarm_below) return 'alarm';
  if(m.warn_above!==undefined  && v>=m.warn_above)  return 'warn';
  if(m.warn_below!==undefined  && v<=m.warn_below)  return 'warn';
  if(m.ok_from!==undefined && m.ok_to!==undefined)
    return (v>=m.ok_from && v<=m.ok_to) ? 'ok' : (v<=0.6 ? 'off' : 'warn');
  return 'ok';
}
function modelSilnikaKrok(dt){
  if(!modelSilnika) return;
  const zezw = !!wyjsciaTeraz().ignition;
  // potwierdzenie pracy: tylko gdy rozrusznik kręci i wylosowany czas minął
  if (!!wyjsciaTeraz().starter && !we.running && czasZaskoku!==null && wStanie>=czasZaskoku){
    we.running=true;
  }
  // po zdjęciu zapłonu silnik zatrzymuje się w 1,5–2,5 s
  if (we.running && !zezw){
    if (czasZgaszenia===null) czasZgaszenia = t + 1.5 + Math.random();
    else if (t>=czasZgaszenia){ we.running=false; czasZgaszenia=null; }
  } else if (zezw) { czasZgaszenia=null; }
}
function tik(dt){
  t+=dt; wStanie+=dt;
  krokWyjsc(dt);
  modelInstalacji(dt);
  modelPomiarow(dt);
  modelSilnikaKrok(dt);
  logujZmianyWe();
  filtrKrok(dt);
  logujZmianyFiltr();
  const lista=(M.states[stan]||{}).transitions||[];
  for(let i=0;i<lista.length;i++){
    const p=lista[i];
    if(gotowe(p)){
      const poprz=stan;
      zastosujAkcje(p.actions);
      stan=p.to; wStanie=0;
      const kl = jestAwaria(stan)?'a':'s';
      // migawka PO zastosowaniu akcji — opis „Próba {attempts}/{attempts_max}"
      // ma pokazywać licznik już zinkrementowany
      dopisz({typ:'przejscie',z:poprz,cel:stan,i:i,snap:migawka(),kl:kl});
      dzwiekPrzejscia('GENS', Object.keys(M.states).indexOf(stan), jestAwaria(stan));
      zastosujAkcje((M.states[stan]||{}).actions);
      if (poprz===stanIdle && stan!==stanIdle) { cyklStart=t; }
      if (poprz!==stanIdle && stan===stanIdle) {
        cyklOstatni = (cyklStart!==null) ? t-cyklStart : null;
        cyklStart=null; cykle++;
        if (cyklOstatni!==null){ dopisz({typ:'cykl',s:cyklOstatni.toFixed(1),kl:'s'});
          graj('cycle', 0.65); }
      }
      if (modelSilnika && !!wyjsciaStanu().starter){
        if (Math.random() < PROG_NIEUDANEJ){
          czasZaskoku = Infinity;
          dopisz({typ:'model',co:'noCatch',kl:'m'});
        } else {
          czasZaskoku = 2.0 + Math.random()*0.8;
          dopisz({typ:'model',co:'catch',s:czasZaskoku.toFixed(1),kl:'m'});
        }
      }
      break;
    }
  }
  logujZmianyWy();
  // wejścia chwilowe wracają do zera
  for(const k in (M.inputs||{})) if(M.inputs[k].momentary && we[k]){ we[k]=false; }
  logujZmianyWe();
  filtrKrok(0); logujZmianyFiltr();
  odswiez();
}

let cacheFiltr={};
function rysujWejscia(){
  const c=document.getElementById('wejscia'); c.innerHTML=''; cacheFiltr={};
  for(const k in (M.inputs||{})){
    const w=M.inputs[k];
    const d=document.createElement('div'); d.className='wiersz';
    const auto = ((k==='running' && modelSilnika) || (k==='gen_request' && modelDeye && PL))
                 ? ' <span class="auto">auto</span>' : '';
    const hl = limitHold(k);
    const fil = (hl!==null&&hl!==undefined) ? ' <span class="filtr"></span>' : '';
    const opis = TY('inputs.'+k+'.description', w.description||'');
    d.innerHTML='<div class="etyk">'+(w.pin?'<span class="pin">'+esc(w.pin)+'</span> ':'')+
      esc(etykPinu('inputs',k))+auto+fil+
      (opis?'<small>'+esc(podstaw(opis))+linkUrzadzenia(w,'inputs.'+k)+'</small>':'')+'</div>';
    const p=document.createElement('div');
    p.className='przel'+(w.momentary?' chwil':''); p.dataset.k=k;
    p.onclick=()=>{
      if(k==='running' && modelSilnika){ modelSilnika=false; dopisz({typ:'model',co:'manual',kl:'m'}); }
      if(k==='gen_request' && modelDeye && PL){ modelDeye=false;
        dopisz({typ:'txt', txt:T('plant.deyeOff'), kl:'m'}); rysujWejscia(); }
      we[k]=!we[k]; logujZmianyWe(); filtrKrok(0); logujZmianyFiltr(); odswiez(); };
    d.appendChild(p); c.appendChild(d);
    const f=d.querySelector('.filtr'); if(f) cacheFiltr[k]=f;
  }
  // --- INSTALACJA: to, czym operator naprawdę steruje ---
  // Styk IN-01 nie jest już klikany wprost: zwiera go Deye, gdy SOC zejdzie
  // do progu. Operator rusza świat fizyczny, a nie wyjście falownika.
  if(PL){
    const h=document.createElement('div'); h.className='wiersz dzial'; h.style.cursor='help';
    h.title=T('plant.note');
    h.innerHTML='<div class="etyk"><b>'+esc(T('plant.header'))+'</b></div>';
    c.appendChild(h);

    const suw=(klucz,etyk,min,max,krok,wart,jedn,fn)=>{
      const d=document.createElement('div'); d.className='wiersz suwak';
      d.innerHTML='<div class="etyk">'+esc(etyk)+
        '<span class="suw-w" id="w_'+klucz+'"></span>'+
        '<input type="range" min="'+min+'" max="'+max+'" step="'+krok+'" value="'+wart+'"></div>';
      const r=d.querySelector('input');
      r.oninput=()=>{ fn(parseFloat(r.value));
        document.getElementById('w_'+klucz).textContent=fn(null)+' '+jedn; };
      c.appendChild(d);
      document.getElementById('w_'+klucz).textContent=fn(null)+' '+jedn;
    };
    suw('pv', T('plant.pv'), 0, 4.5, 0.1, INST.pv_kw, 'kW',
        v=>{ if(v!==null) INST.pv_kw=v; return INST.pv_kw.toFixed(1); });
    suw('load', T('plant.load'), 0.2, 2.0, 0.1, INST.load_kw, 'kW',
        v=>{ if(v!==null) INST.load_kw=v; return INST.load_kw.toFixed(1); });

    const pr=document.createElement('div'); pr.className='wiersz'; pr.style.cursor='help';
    pr.title=T('plant.showerNote');
    pr.innerHTML='<div class="etyk">'+esc(T('plant.shower'))+'</div>';
    const pb=document.createElement('button'); pb.className='mini';
    pb.textContent=T('plant.showerBtn');
    pb.onclick=()=>{ INST.prysznic=PL.loads.shower_minutes*60;
      dopisz({typ:'txt', txt:T('plant.showerLog'), kl:'m'}); odswiez(); };
    pr.appendChild(pb); c.appendChild(pr);

    const dm=document.createElement('div'); dm.className='wiersz'; dm.style.cursor='help';
    dm.title=T('plant.deyeNote');
    dm.innerHTML='<div class="etyk"><b>'+esc(T('plant.deyeModel'))+'</b></div>';
    const dp=document.createElement('div');
    dp.className='przel'+(modelDeye?' on':''); dp.id='przelDeye';
    dp.onclick=()=>{ modelDeye=!modelDeye;
      dopisz({typ:'txt', txt:modelDeye?T('plant.deyeOn'):T('plant.deyeOff'), kl:'m'});
      rysujWejscia(); odswiez(); };
    dm.appendChild(dp); c.appendChild(dm);
  }

  // warstwa symulacji na końcu — po wejściach, które istnieją w szafie
  const m=document.createElement('div'); m.className='wiersz model';
  m.innerHTML='<div class="etyk"><b>'+esc(T('model.label'))+'</b>'+
    '<small>'+esc(T('model.description'))+'</small></div>';
  const mp=document.createElement('div');
  mp.className='przel'+(modelSilnika?' on':''); mp.id='przelModel';
  mp.onclick=()=>{ modelSilnika=!modelSilnika;
    dopisz({typ:'model',co:modelSilnika?'modelOn':'modelOff',kl:'m'});
    rysujWejscia(); odswiez(); };
  m.appendChild(mp); c.appendChild(m);
}
// Dobiera rozmiar svg w pikselach. Dopasowuje do panelu dopóki tekst nie zrobi się
// mniejszy niż MIN_TEKST — poniżej tego progu płótno przewija się zamiast kurczyć
// dalej. Przy 1600x900 samo dopasowanie dawało tekst chipu 3,5 px.
//
// Próg jest w ROZMIARZE TEKSTU, nie w surowej skali: węzły GENS_ mają czcionkę 13,
// chipy schematu 10,5, więc ta sama skala daje w obu widokach inną czytelność
// i stały próg skali niepotrzebnie włączałby przewijanie w widoku GENS_.
const MIN_TEKST = 8.4;
function dopasujPlotno(vbW, vbH, czcionkaBazowa){
  const svg=document.getElementById('svg'), pl=document.getElementById('plotno');
  const dostW=Math.max(60, pl.clientWidth), dostH=Math.max(60, pl.clientHeight);
  const minSk=MIN_TEKST/(czcionkaBazowa||13);
  const sk=Math.max(Math.min(dostW/vbW, dostH/vbH), minSk);
  svg.style.width=(vbW*sk)+'px';
  svg.style.height=(vbH*sk)+'px';
}

function rysujSvg(){
  const S=M.states;
  if(!S || !Object.keys(S).length) { document.getElementById('svg').innerHTML=''; return; }
  const W=160, H=56, MAR=26;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const k in S){
    minX=Math.min(minX,S[k].x); minY=Math.min(minY,S[k].y);
    maxX=Math.max(maxX,S[k].x+W); maxY=Math.max(maxY,S[k].y+H);
  }
  const svg=document.getElementById('svg');
  svg.setAttribute('viewBox',(minX-MAR)+' '+(minY-MAR)+' '+
    (maxX-minX+2*MAR)+' '+(maxY-minY+2*MAR));
  dopasujPlotno(maxX-minX+2*MAR, maxY-minY+2*MAR, 13);   // czcionka węzła GENS_
  let g='<defs><marker id="gr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">'+
        '<path d="M0,0 L8,3 L0,6 z" fill="#52677c"/></marker>'+
        '<marker id="grA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">'+
        '<path d="M0,0 L8,3 L0,6 z" fill="#4fb477"/></marker></defs>';
  // strzałki
  for(const k in S){
    const lst=S[k].transitions||[];
    for(let i=0;i<lst.length;i++){
      const p=lst[i];
      const a=S[k], b=S[p.to]; if(!b) continue;
      const x1=a.x+W/2, y1=a.y+H/2, x2=b.x+W/2, y2=b.y+H/2;
      const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
      const ux=dx/L, uy=dy/L;
      const rx=W/2+9, ry=H/2+9;
      // odległość od środka do krawędzi prostokąta wzdłuż (ux,uy)
      const kraw=(u,v)=>Math.min(Math.abs(u)<1e-6?1e9:rx/Math.abs(u),
                                 Math.abs(v)<1e-6?1e9:ry/Math.abs(v));
      const d1=kraw(ux,uy), d2=d1;
      const px1=x1+ux*d1, py1=y1+uy*d1;
      const px2=x2-ux*d2, py2=y2-uy*d2;
      const akt=(k===stan), ok=akt&&gotowe(p);
      // łuk: wygięcie w lewo względem kierunku jazdy — rozdziela pary tam i z powrotem
      const lx=px2-px1, ly=py2-py1, LL=Math.hypot(lx,ly)||1;
      const nx=-ly/LL, ny=lx/LL;
      const wyg=Math.min(LL*0.18, 52);
      const cx=(px1+px2)/2+nx*wyg, cy=(py1+py2)/2+ny*wyg;
      const tre = podstaw(opisPrzejscia(k,i,p));
      g+='<path d="M '+px1+' '+py1+' Q '+cx+' '+cy+' '+px2+' '+py2+'" fill="none" '+
         'stroke="'+(ok?'#4fb477':(akt?'#7BAFD4':'#3a4a5c'))+'" stroke-width="'+(akt?2.2:1.3)+'" '+
         'marker-end="url(#'+(ok?'grA':'gr')+')" opacity="'+(akt?1:.5)+'">'+
         '<title>'+esc(k+' → '+p.to+(tre?'\n'+tre:'')+(p.when!==undefined?'\n'+T('word.when')+': '+p.when:'')+
         (p.after!==undefined?'\n'+T('word.after')+': '+p.after:''))+'</title></path>';
    }
  }
  // węzły
  for(const k in S){
    const s=S[k], akt=(k===stan), awa=jestAwaria(k);
    const kol = akt ? (awa?'#e05c4b':'#F7A800') : '#2b3a49';
    const txt = akt ? (awa?'#2a0d08':'#2a1d00') : '#cfe0ee';
    g+='<g><rect x="'+s.x+'" y="'+s.y+'" width="'+W+'" height="'+H+'" rx="10" '+
       'fill="'+kol+'" stroke="'+(akt?kol:'#3a4a5c')+'" stroke-width="'+(akt?2.5:1.3)+'"/>'+
       '<text x="'+(s.x+W/2)+'" y="'+(s.y+H/2+5)+'" text-anchor="middle" '+
       'font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="'+txt+'">'+k+'</text>'+
       '<title>'+esc(podstaw(opisStanu(k))||k)+'</title></g>';
  }
  svg.innerHTML=g;
}

let cachePom=null;
function wszystkiePomiary(){
  return Object.assign({}, (M&&M.measurements)||{}, (PL&&PL.measurements)||{});
}
function budujPomiary(){
  const c=document.getElementById('pomiary'); c.innerHTML=''; cachePom={};
  const WSZ=wszystkiePomiary();
  for(const k in WSZ){
    const m=WSZ[k];
    const opis=TY('measurements.'+k+'.description', m.description||'');
    // Opis idzie w dymek, nie pod wiersz: panel ma być gęsty jak tablica
    // przyrządów, a nie czytanką. Treść zostaje w YAML-u i na hover.
    const d=document.createElement('div'); d.className='pomiar';
    d.innerHTML='<div class="pom-gora"><span class="pom-et">'+
      esc(TY('measurements.'+k+'.label', m.label||k))+'</span>'+
      '<span class="pom-w"></span></div>'+
      '<div class="pom-bar"><div class="pom-fill"></div></div>';
    c.appendChild(d);
    // zakres i próg dopisane do dymka, nie jako osobny wiersz — osiem pomiarów
    // razy jeden wiersz to 128 px, których ta kolumna nie ma
    const prog = m.ok_from!==undefined ? (m.ok_from+'–'+m.ok_to+' '+(m.unit||''))
               : m.warn_below!==undefined ? ('⚠ < '+m.warn_below+' '+(m.unit||''))
               : m.warn_above!==undefined ? ('⚠ > '+m.warn_above+' '+(m.unit||''))
               : (m.min+'–'+m.max+' '+(m.unit||''));
    d.title = prog + (opis ? '\n\n'+opis : '');
    cachePom[k]={ w:d.querySelector('.pom-w'), f:d.querySelector('.pom-fill') };
  }
}
function odswiezPomiary(){
  if(!cachePom) budujPomiary();
  const KOL={ ok:'#4fb477', warn:'#F7A800', alarm:'#e05c4b', off:'#4a5e74' };
  const WSZ=wszystkiePomiary();
  for(const k in cachePom){
    const m=WSZ[k], v=POM[k]||0, st=stanPomiaru(k);
    const dok = (m.max-m.min) > 200 ? 0 : 1;
    cachePom[k].w.textContent = v.toFixed(dok)+' '+(m.unit||'');
    cachePom[k].w.style.color = KOL[st];
    const pr = Math.max(0, Math.min(100, (v-m.min)/(m.max-m.min)*100));
    cachePom[k].f.style.width = pr+'%';
    cachePom[k].f.style.background = KOL[st];
  }
}
function odswiezSynoptyke(){
  const c=document.getElementById('synoptyka'); if(!c) return;
  const lista=M.synoptic||[];
  if(c.childElementCount===0){
    c.innerHTML = lista.map((b,i)=>
      (i?'<span class="syn-strz">→</span>':'')+
      '<div class="syn" data-b="'+b.id+'"><div class="syn-et"></div><div class="syn-w"></div></div>'
    ).join('');
    // Skrót na kafelku banku. Oba progi dzieli kilkanaście godzin instalacji,
    // więc kliknięcie stawia SOC tuż PRZED najbliższym zdarzeniem — zależnie
    // od fazy. Samo przekroczenie progu zachodzi dalej samo, żeby widać było
    // sekwencję, a nie jej wynik.
    //   ładowanie  → tuż pod progiem Stop,  czyli za chwilę styk się rozewrze
    //   pozostałe  → tuż nad progiem Start, czyli za chwilę styk się zewrze
    const kb=c.querySelector('.syn[data-b="bank"]');
    if(kb && PL){
      kb.style.cursor='pointer';
      kb.onclick=()=>{
        const d=PL.deye, lad=(INST.stanDeye==='DEYE_CHARGING');
        INST.soc = lad ? (d.gen_stop_soc - 1) : (d.gen_start_soc + 1);
        POM.soc = INST.soc;
        dopisz({typ:'txt', kl:'m',
          txt:(lad?T('plant.bankLogStop'):T('plant.bankLog'))+' '+INST.soc.toFixed(0)+' %'});
        odswiez();
      };
    }
  }
  const praca=!!we.running, kreci=!!wyjsciaTeraz().starter, zad=!!we.gen_request;
  const mu=wszystkiePomiary().u_gen;
  const wOknie = POM.u_gen>=mu.ok_from && POM.u_gen<=mu.ok_to;
  const st=INST.stanDeye||'—';
  const prog = PL ? PL.deye.gen_start_soc : 30;
  const dane={
    pv:     { w: (POM.p_pv/1000).toFixed(1)+' kW',  kl: POM.p_pv>50?'on':'off' },
    load:   { w: (POM.p_load/1000).toFixed(1)+' kW',kl: POM.p_load>0?'on':'off' },
    bank:   { w: POM.soc.toFixed(0)+' %',
              kl: POM.soc<=prog?'alarm':(POM.p_bank>0?'on':'warn') },
    deye:   { w: st.replace('DEYE_','').replace(/_/g,'/'), kl: zad?'warn':'on' },
    request:{ w: zad?'ON':'OFF',                    kl: zad?'on':'off' },
    engine: { w: praca?T('syn.running'):(kreci?T('syn.cranking'):T('syn.stopped')),
              kl: praca?'on':(kreci?'warn':'off') },
    phase:  { w: POM.u_gen.toFixed(0)+' V',         kl: wOknie?'on':(POM.u_gen>0.6?'alarm':'off') }
  };
  // Kolory ustawiane STYLEM INLINE, nie klasami. Przy klasach cztery z sześciu
  // bloków nie łapały reguły `.syn.on` mimo poprawnie ustawionej klasy —
  // kaskada, nie logika. Inline wygrywa zawsze i znika cała ta klasa problemów,
  // dokładnie jak w paskach pomiarów, które od początku działały.
  const STYLSYN={
    on:    {ram:'#4fb477', tlo:'#16301f', op:'1'},
    warn:  {ram:'#F7A800', tlo:'#2a2208', op:'1'},
    alarm: {ram:'#e05c4b', tlo:'#2a1614', op:'1'},
    off:   {ram:'#26333f', tlo:'#1a2430', op:'.45'}
  };
  const kbx=c.querySelector('.syn[data-b="bank"]');
  if(kbx && PL){
    const dymek = (INST.stanDeye==='DEYE_CHARGING')
      ? T('plant.bankClickStop') : T('plant.bankClick');
    if(kbx.title!==dymek) kbx.title=dymek;
  }
  c.querySelectorAll('.syn').forEach(el=>{
    const id=el.dataset.b, d=dane[id]||{w:'--',kl:'off'};
    el.querySelector('.syn-et').textContent=T('syn.'+id);
    el.querySelector('.syn-w').textContent=d.w;
    const st=STYLSYN[d.kl]||STYLSYN.off;
    el.style.borderColor=st.ram;
    el.style.background=st.tlo;
    el.style.opacity=st.op;
  });
}
function budujLiczniki(){
  const cl=document.getElementById('liczniki'); cl.innerHTML=''; cacheLic={};
  for(const k in lic){
    const sp=document.createElement('span');
    sp.innerHTML=esc(TY('counters.'+k,k))+' <b></b>';
    cl.appendChild(sp); cacheLic[k]=sp.querySelector('b');
  }
  const sp=document.createElement('span');
  sp.innerHTML=esc(T('counter.time'))+' <b></b>';
  cl.appendChild(sp); cacheLic.__czas=sp.querySelector('b');
}
function budujPrzejscia(){
  const pc=document.getElementById('przejscia'); pc.innerHTML='';
  const lst=(M.states[stan]||{}).transitions||[];
  for(let i=0;i<lst.length;i++){
    const p=lst[i];
    const e=document.createElement('div'); e.className='przej';
    let w='→ <b>'+esc(p.to)+'</b>';
    if(p.when) w+=' <code>'+esc(p.when)+'</code>';
    if(p.after!==undefined) w+=' <code class="zegar-p"></code>';
    const op=opisPrzejscia(stan,i,p);
    if(op) w+='<small>'+esc(podstaw(op))+'</small>';
    e.innerHTML=w; e._p=p; pc.appendChild(e);
  }
}
function odswiez(){
  const fc=(s)=>{ const m=Math.floor(s/60), r=s-m*60;
    return m>0 ? (m+':'+r.toFixed(0).padStart(2,'0')) : (r.toFixed(1)+' s'); };
  const ec=document.getElementById('cyklCzas'), eo=document.getElementById('cyklOpis');
  if (cyklStart!==null){ ec.textContent=fc(t-cyklStart); ec.classList.remove('zamkniety'); eo.textContent=T('cycle.open'); }
  else if (cyklOstatni!==null){ ec.textContent=fc(cyklOstatni); ec.classList.add('zamkniety'); eo.textContent=T('cycle.closed'); }
  else { ec.textContent='—'; ec.classList.remove('zamkniety'); eo.textContent=T('cycle.idle'); }
  document.getElementById('cykle').textContent=cykle;
  const ew=document.getElementById('warp');
  if(ew && PL){
    const w=INST.warp||1;
    ew.textContent = w>1 ? (T('plant.warp')+' ×'+w) : T('plant.realtime');
    ew.classList.toggle('rt', w<=1);
  }

  document.querySelectorAll('.przel[data-k]').forEach(p=>p.classList.toggle('on',!!we[p.dataset.k]));
  const pm=document.getElementById('przelModel'); if(pm) pm.classList.toggle('on',modelSilnika);

  // licznik filtra: widoczny tylko gdy pin jest ON, a logika jeszcze go nie widzi
  for(const k in cacheFiltr){
    const lim=limitHold(k), el=cacheFiltr[k];
    const trwa = !!we[k] && !weF[k];
    el.classList.toggle('widac', trwa);
    if(trwa) el.textContent=T('word.hold')+' '+(holdT[k]||0).toFixed(1)+'/'+lim+' s';
  }

  if(!cacheWy) budujWyjscia();
  // Kolory ustawiane STYLEM INLINE. Przy klasach `background` z reguły `.wy.on`
  // nie wchodził, choć `border-color` i `box-shadow` z TEJ SAMEJ reguły wchodziły,
  // a enumeracja arkusza nie pokazała żadnej reguły nadpisującej. Nie udało się
  // ustalić przyczyny, więc idzie inline — tak jak paski pomiarów i pasmo
  // synoptyczne, które od początku działały bez niespodzianek.
  const wy=wyjsciaTeraz();
  for(const k in cacheWy){
    const v=!!wy[k], c=cacheWy[k];
    c.wiersz.style.borderColor = v ? '#4fb477' : '#26333f';
    c.wiersz.style.background  = v ? '#15291f' : '#1a2430';
    c.dioda.style.background   = v ? '#4fb477' : '#27333f';
    c.dioda.style.borderColor  = v ? '#8fe6b5' : '#3a4a5c';
    c.dioda.style.boxShadow    = v ? '0 0 9px #4fb477' : 'none';
    c.stan.style.color         = v ? '#4fb477' : '#5f7287';
    c.stan.textContent = v ? 'ON' : 'OFF';
  }

  odswiezPomiary();
  odswiezSynoptyke();
  if(!cacheLic) budujLiczniki();
  // licznik prób pokazany jako x/limit — sama liczba nie mówi, ile zostało
  const limit=(M.parameters||{}).attempts_max;
  for(const k in lic) if(cacheLic[k])
    cacheLic[k].textContent = (k==='attempts' && limit!==undefined)
      ? (lic[k]+'/'+limit) : lic[k];
  cacheLic.__czas.textContent=wStanie.toFixed(1)+' s';

  if(stan!==ostatniStan){
    document.getElementById('stanNazwa').textContent=stan;
    document.getElementById('stanOpis').textContent=podstaw(opisStanu(stan));
    budujPrzejscia();
    ostatniStan=stan;
  }
  let podpis='';
  document.querySelectorAll('#przejscia .przej').forEach(e=>{
    const p=e._p; if(!p) return;
    const ok=gotowe(p); podpis+=ok?'1':'0';
    e.classList.toggle('gotowe', ok);
    const z=e.querySelector('.zegar-p');
    if(z){ const lim=(typeof p.after==='string')?(M.parameters||{})[p.after]:p.after;
      z.textContent=T('word.after')+' '+wStanie.toFixed(1)+'/'+lim+' s'; }
  });
  const sig=stan+'|'+podpis;
  if(sig!==ostatniSvg){ rysujSvg(); ostatniSvg=sig; }
}
function ustawGre(v){
  gra=v;
  if(petla) clearInterval(petla);
  if(gra){
    const mn=parseFloat(document.getElementById('tempo').value);
    petla=setInterval(()=>tik(0.1*mn),100);
  }
}
// file:// i konteksty bez HTTPS potrafią odmówić dostępu do schowka
function awaryjneKopiuj(txt, ok){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok(); }catch(e){}
  document.body.removeChild(ta);
}
// Kliknięcie w dziennik kopiuje go w całości. Zaznaczanie tekstu ma nadal
// działać, więc kopiujemy tylko wtedy, gdy nic nie jest zaznaczone.
(function(){
  const el=document.getElementById('log'); if(!el) return;
  el.style.cursor='copy';
  el.onclick=()=>{
    let zazn=''; try{ zazn=String(window.getSelection()); }catch(e){}
    if(zazn.trim()) return;
    const txt=tekstDziennika();
    const udalo=()=>{
      const h=el.closest('.karta').querySelector('h2');
      h.textContent=T('log.copied')+' '+DZIENNIK.length;
      setTimeout(()=>{ h.textContent=T('card.log'); }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(udalo, ()=>awaryjneKopiuj(txt,udalo));
    else awaryjneKopiuj(txt,udalo);
  };
})();
