# Genset controller — SMARTBOB SM-MINI-0808R, board revisions 1.5 / 1.6 / 1.7.
# One MCP23017 at 0x20 serves both the inputs and the relays; the vendor
# spreadsheet (sheet "PRZEKAŹNIKI 0808R") gives the same mapping for all three
# revisions.
#
# This implements state-machine.yaml. Why it is built this way is in README.md;
# the Deye readout is an opt-in package, deye-modbus.yaml.
# Simulator: https://www.enklava.co/files/symulator-agregatu-d2Ih/

substitutions:
  device_name: genset-controller
  # State machine parameters. Seconds, bare numbers because the lambda compares
  # them against a float — except the one consumed by a sensor filter, which
  # needs a unit.
  t_request_hold: "5s"     # input filter, not a state timer
  t_ready: "5"             # minimum dwell in GENS_READY
  t_prestart: "1"          # ignition live before the starter
  t_attempt: "4"           # whole attempt window, t_prestart included
  t_pause: "10"            # starter rest between attempts
  t_rundown: "10"          # time allowed for the engine to come to a stop
  t_kill: "3"              # how long the ignition stays shorted to ground
  attempts_max: "3"

esphome:
  name: ${device_name}
  on_boot:
    priority: 600
    then:
      # Inputs referenced to ground — the Deye G-start contact is volt-free.
      - switch.turn_on: in_gnd
      - switch.turn_off: in_vcc
      # Safe state, stated explicitly as well as by restore_mode: all three
      # relays off is GENS_READY with the ignition shorted to ground.
      - switch.turn_off: relay_01
      - switch.turn_off: relay_02
      - switch.turn_off: relay_03

esp32:
  board: esp32dev

logger:
api:
ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:                 # `clk_mode: GPIO17_OUT` is removed in ESPHome 2026.11
    mode: CLK_OUT
    pin: 17
  phy_addr: 0

# GPIO15, GPIO5 and GPIO12 are strapping pins and ESPHome warns about all three
# on every build. The warning is expected and stays visible: these are the
# vendor's own pins from the spreadsheet, not a choice of ours.
i2c:
  - id: bus_a
    sda: 15
    scl: 5
    scan: true

mcp23017:
  - id: mcp_hub
    address: 0x20
    i2c_id: bus_a

globals:
  - id: state                 # index into NAMES below, 0 = GENS_READY
    type: int
    restore_value: false
    initial_value: '0'
  - id: in_state              # seconds in the current state
    type: float
    restore_value: false
    initial_value: '0'
  - id: attempts
    type: int
    restore_value: false
    initial_value: '0'

binary_sensor:
  - platform: gpio
    name: "Deye start signal"
    id: in_gen_request
    pin: { mcp23xxx: mcp_hub, number: 8, mode: { input: true, pullup: false }, inverted: true }
    # Asymmetric: slow to accept, immediate to release. The request hold lives
    # here, so the lambda can treat the signal as already qualified.
    # Block style, not flow: a plain scalar in a flow sequence may not contain
    # braces, so [ delayed_on: ${t_request_hold} ] is not valid YAML.
    filters:
      - delayed_on: ${t_request_hold}
      - delayed_off: 200ms

  - platform: gpio
    name: "Run confirmed"
    id: in_running
    pin: { mcp23xxx: mcp_hub, number: 6, mode: { input: true, pullup: false }, inverted: true }
    filters: [ delayed_on: 500ms, delayed_off: 1000ms ]   # no panic on a voltage dip

  - platform: gpio
    name: "CO alarm"
    id: in_co_alarm
    pin: { mcp23xxx: mcp_hub, number: 5, mode: { input: true, pullup: false }, inverted: true }
    filters: [ delayed_on: 50ms ]

  - platform: gpio
    name: "Kill button"
    id: in_kill_btn
    pin: { mcp23xxx: mcp_hub, number: 3, mode: { input: true, pullup: false }, inverted: true }
    filters: [ delayed_on: 50ms ]

  - platform: gpio
    name: "Fault reset"
    id: in_reset
    pin: { mcp23xxx: mcp_hub, number: 4, mode: { input: true, pullup: false }, inverted: true }
    filters: [ delayed_on: 50ms ]

  - platform: template
    name: "Genset fault"
    id: fault
    device_class: problem
    lambda: 'return id(state) == 5;'

# The relays are driven by the state machine and by nothing else. The vendor
# template wires inputs straight to relays (on_press -> switch.turn_on); that
# is absent here and must stay absent.
switch:
  - platform: gpio
    name: "IN-VCC"
    id: in_vcc
    pin: GPIO12
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "IN-GND"
    id: in_gnd
    pin: GPIO4
    restore_mode: ALWAYS_ON

  - platform: gpio                      # RELAY-01, energise-to-run
    name: "Ignition relay"
    id: relay_01
    pin: { mcp23xxx: mcp_hub, number: 7 }
    restore_mode: ALWAYS_OFF
  - platform: gpio                      # RELAY-02, drives the contactor coil
    name: "Starter relay"
    id: relay_02
    pin: { mcp23xxx: mcp_hub, number: 9 }
    restore_mode: ALWAYS_OFF
  - platform: gpio                      # RELAY-03, energise-to-stop
    name: "Kill relay"
    id: relay_03
    pin: { mcp23xxx: mcp_hub, number: 10 }
    restore_mode: ALWAYS_OFF

# =====================================================================
#  STATE MACHINE — states, outputs, transitions. Nothing else belongs here.
# =====================================================================
script:
  - id: apply_outputs
    mode: single
    then:
      - lambda: |-
          const int s = id(state);
          const bool ign = (s >= 1 && s <= 3);                        // CRANKING, PAUSE, RUNNING
          const bool crk = (s == 1 && id(in_state) >= ${t_prestart}); // delayed on, immediate off
          const bool kil = (s == 4 || s == 5);                        // STOPPING, FAULT
          if (id(relay_01).state != ign) ign ? id(relay_01).turn_on() : id(relay_01).turn_off();
          if (id(relay_02).state != crk) crk ? id(relay_02).turn_on() : id(relay_02).turn_off();
          if (id(relay_03).state != kil) kil ? id(relay_03).turn_on() : id(relay_03).turn_off();

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static const char* NAMES[6] =
            {"GENS_READY","GENS_CRANKING","GENS_PAUSE","GENS_RUNNING",
             "GENS_STOPPING","GENS_FAULT"};
          id(in_state) += 0.1f;

          const bool req = id(in_gen_request).state;   // already held t_request_hold
          const bool run = id(in_running).state;
          const bool co  = id(in_co_alarm).state;
          const bool rst = id(in_reset).state;
          const bool kil = id(in_kill_btn).state;

          const int s = id(state);
          int next = s;

          switch (s) {
            case 0: // GENS_READY
              if (req && !co && !run && id(in_state) >= ${t_ready}) next = 1;
              break;
            case 1: // GENS_CRANKING
              if (co) next = 5;
              else if (kil) next = 4;
              else if (!req) next = 4;
              else if (run) next = 3;
              else if (id(in_state) >= ${t_attempt}) {
                id(attempts) += 1;
                next = (id(attempts) >= ${attempts_max}) ? 5 : 2;
              }
              break;
            case 2: // GENS_PAUSE
              if (co) next = 5;
              else if (kil) next = 4;
              else if (run) next = 3;
              else if (!req) next = 0;
              else if (id(in_state) >= ${t_pause}) next = 1;
              break;
            case 3: // GENS_RUNNING
              if (co) next = 5;
              else if (kil) next = 4;
              else if (!run) next = 5;
              else if (!req) next = 4;
              break;
            case 4: // GENS_STOPPING — both conditions, see README
              if (!run && id(in_state) >= ${t_kill}) next = 0;
              else if (id(in_state) >= ${t_rundown}) next = 5;
              break;
            case 5: // GENS_FAULT
              if (rst && !co && !run) next = 0;
              break;
          }

          if (next != s) {
            ESP_LOGI("genset", "%s -> %s (attempts=%d)", NAMES[s], NAMES[next], id(attempts));
            id(state) = next;
            id(in_state) = 0;
            if (next == 0) id(attempts) = 0;
            id(apply_outputs).execute();
            id(state_text).publish_state(NAMES[next]);
          }

text_sensor:
  - platform: template
    name: "Controller state"
    id: state_text
    update_interval: never

# Entities below belong to THIS sensor: block. A second top-level sensor: block
# silently overrides the first, with no parse error.
sensor:
  - platform: template
    name: "Crank attempts"
    lambda: 'return id(attempts);'
    update_interval: 5s
    accuracy_decimals: 0
  - platform: template
    name: "Time in state"
    unit_of_measurement: s
    lambda: 'return id(in_state);'
    update_interval: 5s
    accuracy_decimals: 0
