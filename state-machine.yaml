# The state machine of the genset controller, and nothing else.
#
# What is NOT here, on purpose: datasheets, gauges, diagram coordinates,
# sounds, the plant around the controller. Those are in plant.yaml, which the
# simulator reads as well. This file is the part that describes control, so it
# is the part that has to stay readable when the gasifier and the retort are
# added next to it.
#
# Every "why" belongs in README.md, not in a comment here.

name: Genset controller FOGO FH9000R — SMARTBOB SM-MINI-0808R
description: >-
  Models the genset only: reads the Deye G-start contact, cranks with an attempt
  limit, stops the engine by shorting the ignition to ground. States carry the
  GENS_ prefix, so the gasifier (GAZ_) and the retort (RET_) can stand beside
  them without colliding.

parameters:
  t_request_hold: 5      # s — request must be held this long (input filter)
  t_ready: 5             # s — minimum dwell in GENS_READY (state timer)
  t_prestart: 1          # s — ignition live before the starter (output delay)
  t_attempt: 4           # s — whole attempt window, t_prestart included
  t_pause: 10            # s — starter rest between attempts
  attempts_max: 3
  t_rundown: 10          # s — time allowed for the engine to come to a stop
  t_kill: 3              # s — how long the kill short is held

counters:
  attempts: 0

inputs:
  gen_request:
    pin: IN-01
    label: Deye start signal
    hold: t_request_hold
    description: G-start dry contact, inverter terminals 1 and 2. ON = run requested.
  running:
    pin: IN-02
    label: Run confirmed
    description: >-
      Dry contact of a single-phase undervoltage relay on one output phase.
      ON = that phase is above the threshold set on the relay, i.e. the genset
      produces. The threshold lives in the relay, not here.
  co_alarm:
    pin: IN-03
    label: CO alarm
    description: Alarm contact of the carbon monoxide detector. ON = CO detected.
  kill_btn:
    pin: IN-05
    label: Kill button
    momentary: true
    description: >-
      Momentary pushbutton. A request, not the kill itself: it sends the machine
      to GENS_STOPPING, which holds the short for t_kill however briefly it was
      pressed.
  reset:
    pin: IN-04
    label: Fault reset
    momentary: true
    description: Momentary pushbutton. Clears GENS_FAULT when nothing blocks it.

outputs:
  ignition:
    pin: RELAY-01
    label: Ignition relay
    description: >-
      Energise-to-run. ON = the NC contact in the kill line is open, ignition
      live. OFF = ignition shorted to ground, engine stopped.
  starter:
    pin: RELAY-02
    label: Starter relay
    delay_on: t_prestart
    description: >-
      Drives the starter contactor coil. Energising waits t_prestart after the
      state asks for it; dropping is immediate.
  kill:
    pin: RELAY-03
    label: Kill relay
    description: >-
      Energise-to-stop, the opposite polarity to the ignition relay and not its
      inverse: energised only while stopping and in a fault.

states:
  GENS_READY:
    description: >-
      Outputs in the safe state, kill line shorted to ground. The start needs
      the request held t_request_hold s and this state held t_ready s — two
      conditions on two different clocks.
    outputs: { ignition: false, starter: false, kill: false }
    actions: { attempts: 0 }
    transitions:
      - to: GENS_CRANKING
        when: gen_request and not co_alarm and not running
        after: t_ready
        description: Request {t_request_hold} s, dwell {t_ready} s — crank

  GENS_CRANKING:
    description: Starter engaged. The time limit protects the bendix.
    outputs: { ignition: true, starter: true, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_STOPPING
        when: not gen_request
        description: Deye signal lost
      - to: GENS_RUNNING
        when: running
        description: Run confirmed
      - to: GENS_FAULT
        after: t_attempt
        when: attempts >= attempts_max - 1
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max} failed — limit reached"
      - to: GENS_PAUSE
        after: t_attempt
        actions: { attempts: "+1" }
        description: "Attempt {attempts}/{attempts_max} failed — pause {t_pause} s"

  GENS_PAUSE:
    description: Starter thermal rest before the next attempt.
    outputs: { ignition: true, starter: false, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_RUNNING
        when: running
        description: Run confirmed
      - to: GENS_READY
        when: not gen_request
        description: Deye signal lost — cycle aborted
      - to: GENS_CRANKING
        after: t_pause
        description: "Pause {t_pause} s elapsed — next attempt"

  GENS_RUNNING:
    description: Engine running, inverter charging the bank.
    outputs: { ignition: true, starter: false, kill: false }
    transitions:
      - to: GENS_FAULT
        when: co_alarm
        description: CO alarm
      - to: GENS_STOPPING
        when: kill_btn
        description: Kill button
      - to: GENS_FAULT
        when: not running
        description: Run confirmation lost without command
      - to: GENS_STOPPING
        when: not gen_request
        description: Deye signal lost

  GENS_STOPPING:
    description: Ignition shorted to ground by both relays, engine coming to a stop.
    outputs: { ignition: false, starter: false, kill: true }
    transitions:
      - to: GENS_READY
        when: not running
        after: t_kill
        description: Stopped, short held {t_kill} s
      - to: GENS_FAULT
        after: t_rundown
        description: "Run confirmation held {t_rundown} s — kill circuit fault"

  GENS_FAULT:
    fault: true
    description: >-
      Ignition off, manual reset required. The reset is blocked while run
      confirmation persists — that would mean a defective kill circuit.
    outputs: { ignition: false, starter: false, kill: true }
    transitions:
      - to: GENS_READY
        when: reset and not co_alarm and not running
        description: Fault reset
